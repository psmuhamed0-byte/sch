<style>
  :root {
    color-scheme: dark;
    --bg: #0c0d10;
    --surface: #15161a;
    --surface2: #1b1c22;
    --border: #2a2b33;
    --accent: #b8935a;
    --accent-soft: rgba(184,147,90,.14);
    --accent-strong: #d4af7a;
    --ink: #ede9e2;
    --muted: #8b8d97;
    --danger: #e07a6b;
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; }
  body {
    font-family: "IBM Plex Sans Arabic", "Tahoma", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(ellipse 600px 300px at 15% -5%, rgba(184,147,90,.07), transparent),
      radial-gradient(ellipse 500px 260px at 90% 0%, rgba(184,147,90,.04), transparent);
    color: var(--ink);
    min-height: 100vh;
    letter-spacing: .1px;

  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
  }
  .card {
    background: var(--surface);
    border: 1px solid var(--border);

    background: linear-gradient(155deg, var(--accent-strong), var(--accent) 70%);

  .title-serif {
    font-weight: 700;
    letter-spacing: .2px;

  }
  .accent-line { width: 34px; height: 2px; background: linear-gradient(90deg, var(--accent), transparent); border-radius:2px; }
  .btn-primary {
    background: linear-gradient(155deg, var(--accent-strong), var(--accent));
    color: #171208;
    font-weight: 600;
    transition: filter .18s ease, transform .18s ease;
  }
  .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); filter: brightness(.97); }
  .btn-ghost {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--ink);
    transition: border-color .2s ease, background .2s ease, color .2s ease;
  }
  .btn-ghost:hover { border-color: rgba(184,147,90,.5); background:#20212a; }
  .btn-outline-accent {
    background: var(--accent-soft);
    color: var(--accent-strong);
    border: 1px solid rgba(184,147,90,.3);
    transition: background .2s ease, border-color .2s ease;
  }
  .btn-outline-accent:hover { background: rgba(184,147,90,.22); border-color: rgba(184,147,90,.55); }
  .btn-logout {
    display:flex; align-items:center; gap:6px;
    background: transparent; border:1px solid var(--border); color: var(--muted);
    padding: 7px 12px; border-radius: 10px; font-size:13px;
    transition: all .2s ease;
  }
  .btn-logout:hover { color: var(--danger); border-color: rgba(224,122,107,.45); background: rgba(224,122,107,.08); }
  input, textarea, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--ink);
    transition: border-color .2s ease, box-shadow .2s ease;
  }
  input::placeholder, textarea::placeholder { color: var(--muted); }
  input:focus, textarea:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(184,147,90,.15);
  }
  select { color: var(--ink); }
  select option { background: var(--surface2); color: var(--ink); }
  input[type=color] { background:transparent; border:1px solid var(--border); border-radius:8px; }

  .fade-in { animation: fadeIn .4s cubic-bezier(.22,.75,.3,1); }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
  .fade-in-fast { animation: fadeIn .18s ease; }
  .pop-in { animation: popIn .22s cubic-bezier(.3,1.4,.6,1); }
  @keyframes popIn { from{opacity:0;transform:scale(.95);} to{opacity:1;transform:scale(1);} }
  .stagger > * { animation: fadeIn .38s cubic-bezier(.22,.75,.3,1) backwards; }
  .accordion-content { overflow:hidden; transition: max-height .38s cubic-bezier(.22,.75,.3,1), opacity .28s ease; }
  .chevron { transition: transform .3s cubic-bezier(.22,.75,.3,1); }

  .rte { min-height:120px; padding:16px 20px; outline:none; line-height:2; color: var(--ink); }
  .rte ul { list-style:disc; padding-inline-start:1.5rem; }
  .rte ol { list-style:decimal; padding-inline-start:1.5rem; }
  .rte img { max-width:100%; border-radius:.6rem; margin:.5rem 0; }
  .rte blockquote { border-inline-start:3px solid var(--accent); padding-inline-start:1rem; color:var(--muted); font-style:italic; }
  .rte table { border-collapse: collapse; width:100%; margin: 10px 0; }
  .rte table td, .rte table th { border: 1px solid var(--border); padding: 8px 10px; min-width: 60px; }
  .rte table th { background: var(--surface2); font-weight:600; }

  .toolbtn { padding:7px 9px; border-radius:8px; color:var(--muted); transition: background .15s, color .15s; }
  .toolbtn:hover { background: var(--accent-soft); color: var(--accent-strong); }

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:var(--bg);}
  ::-webkit-scrollbar-thumb{background:#2f313b;border-radius:999px;}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent);}

  .search-hit { animation: fadeIn .3s ease backwards; }
  .highlight { background: rgba(184,147,90,.28); border-radius: 3px; padding: 0 2px; color:#fbe9d0; }
  .shimmer {
    background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 37%, var(--surface) 63%);
    background-size: 400% 100%;
    animation: shimmer 1.4s ease infinite;
  }
  @keyframes shimmer { 0%{background-position:100% 50%;} 100%{background-position:0 50%;} }
  a, button { -webkit-tap-highlight-color: transparent; }

  .table-popover { position:absolute; z-index:60; }
</style>
</head>

<script>

let state = {

  categoryId: null,
  categories: [],
  allSections: [],

const app = document.getElementById("app");

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function esc(str) {
  if (str == null) return "";
  return String(str).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function highlightText(text, q) {
  if (!q) return esc(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return esc(text);
  const before = esc(text.slice(0, idx));
  const match = esc(text.slice(idx, idx + q.length));
  const after = esc(text.slice(idx + q.length));
  return `${before}<span class="highlight">${match}</span>${after}`;
}

function snippet(text, q, len = 90) {
  if (!text) return "";
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if (idx === -1) return text.slice(0, len);
  const start = Math.max(0, idx - 30);
  return (start > 0 ? "…" : "") + text.slice(start, start + len) + "…";
}

/* ========================= صفحة الدخول ========================= */
function renderGate() {
  app.innerHTML = `

/* ========================= صفحة الكاردات + البحث الشامل ========================= */
async function loadCategories() {
  setState({ view: "categories", loading: true });
  const { data: cats } = await sb.from("kb_categories").select("*").order("position", { ascending: true });
  const { data: secs } = await sb.from("kb_sections").select("id, category_id, title, content_text");
  setState({ categories: cats || [], allSections: secs || [], loading: false });
}

function searchResults() {
  const q = state.query.trim().toLowerCase();
  if (!q) return { cats: state.categories, secHits: [] };
  const cats = state.categories.filter(c =>
    (c.title || "").toLowerCase().includes(q) || (c.description || "").toLowerCase().includes(q)
  );
  const secHits = state.allSections
    .filter(s => (s.title || "").toLowerCase().includes(q) || (s.content_text || "").toLowerCase().includes(q))
    .map(s => ({ ...s, category: state.categories.find(c => c.id === s.category_id) }))
    .filter(s => s.category);
  return { cats, secHits };
}

function renderCategories() {
  const q = state.query.trim();
  const { cats, secHits } = searchResults();
  const hasQuery = q.length > 0;

  app.innerHTML = `
  <header class="panel sticky top-0 z-30 border-b border-[var(--border)]">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="brand-mark">م</div>
        <div>
          <p class="title-serif leading-none">المرجع</p>
          <p class="text-[11px] text-[var(--muted)] mt-0.5">قاعدة المعرفة الداخلية</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        ${state.editMode
          ? `<button id="end-edit" class="btn-ghost text-sm rounded-xl px-3 py-2">إنهاء التعديل</button>`
          : `<button id="ask-edit" class="btn-outline-accent text-sm rounded-xl px-3 py-2">تعديل الصفحة</button>`}
        <button id="logout" class="btn-logout">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
          <span>خروج</span>
        </button>
      </div>
    </div>
    <div class="max-w-5xl mx-auto px-4 pb-4">
      <div class="relative">
        <svg class="absolute top-1/2 -translate-y-1/2 right-4 text-[var(--muted)]" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-cat" value="${esc(state.query)}" placeholder="ابحث في العناوين وكل المحتوى الداخلي..."
          class="w-full rounded-xl pr-11 pl-4 py-3 text-[15px]" />
        ${hasQuery ? `<button id="clear-search" class="absolute top-1/2 -translate-y-1/2 left-4 text-[var(--muted)] hover:text-[var(--ink)] transition">✕</button>` : ""}
      </div>
    </div>
  </header>
  <main class="max-w-5xl mx-auto w-full px-4 py-7 flex-1">
    ${state.editMode ? `<button id="add-card" class="mb-5 btn-primary rounded-xl px-4 py-2.5 text-sm">+ إضافة عنوان جديد</button>` : ""}

    ${state.loading ? skeletonCards() : ""}

    ${!state.loading && hasQuery && secHits.length > 0 ? `
      <div class="mb-7 fade-in">
        <p class="text-xs text-[var(--muted)] mb-2">نتائج من داخل المحتوى (${secHits.length})</p>
        <div class="flex flex-col gap-2">
          ${secHits.slice(0, 8).map((s, i) => `
            <a href="#" data-open-hit data-cat="${s.category_id}" data-sec="${s.id}"
              class="search-hit card rounded-xl px-4 py-3 flex items-center gap-3" style="animation-delay:${i*40}ms">
              <span class="text-lg">${esc(s.category?.icon || "📁")}</span>
              <div class="min-w-0 flex-1">
                <p class="text-sm font-semibold text-[var(--ink)] truncate">${highlightText(s.title, q)}</p>
                <p class="text-xs text-[var(--muted)] truncate">${highlightText(snippet(s.content_text || "", q), q)}</p>
              </div>
              <span class="text-xs text-[var(--accent-strong)] shrink-0">${esc(s.category?.title || "")} ←</span>
            </a>
          `).join("")}
        </div>
      </div>` : ""}

    ${!state.loading ? (
      cats.length === 0 && secHits.length === 0
        ? `<p class="text-[var(--muted)] text-center py-16 fade-in">لا توجد نتائج مطابقة</p>`
        : cats.length > 0 ? `
          ${hasQuery ? `<p class="text-xs text-[var(--muted)] mb-2">العناوين (${cats.length})</p>` : ""}
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4 stagger">
            ${cats.map((cat, i) => `
              <div class="relative group" style="animation-delay:${i*45}ms">
                <a href="#" data-open-cat="${cat.id}" class="card block rounded-2xl p-5 h-full">
                  <div class="text-3xl mb-3">${esc(cat.icon || "📁")}</div>
                  <h3 class="font-semibold text-[var(--ink)] mb-1">${hasQuery ? highlightText(cat.title, q) : esc(cat.title)}</h3>
                  <p class="text-sm text-[var(--muted)] line-clamp-2">${hasQuery ? highlightText(cat.description || "", q) : esc(cat.description || "")}</p>

                ${state.editMode ? `
                  <div class="absolute top-3 left-3 flex gap-1 opacity-0 group-hover:opacity-100 transition">

                  </div>` : ""}
              </div>`).join("")}
          </div>` : ""
    ) : ""}
  </main>
  <div id="modal-root"></div>
  `;

  const searchInput = document.getElementById("search-cat");
  searchInput.addEventListener("input", (e) => {
    state.query = e.target.value;
    renderCategories();
    const el = document.getElementById("search-cat");
    el.focus(); el.selectionStart = el.selectionEnd = el.value.length;
  });
  const clearBtn = document.getElementById("clear-search");
  if (clearBtn) clearBtn.addEventListener("click", () => { state.query = ""; renderCategories(); });

  document.getElementById("logout").addEventListener("click", () => {
    sessionStorage.removeItem("kb_access_ok");
    setState({ view: "gate", editMode: false });
  });
  const askEdit = document.getElementById("ask-edit");
  if (askEdit) askEdit.addEventListener("click", () => openPasswordModal(() => setState({ editMode: true })));
  const endEdit = document.getElementById("end-edit");
  if (endEdit) endEdit.addEventListener("click", () => setState({ editMode: false }));
  const addCard = document.getElementById("add-card");
  if (addCard) addCard.addEventListener("click", () => openCardModal({}));

  document.querySelectorAll("[data-open-cat]").forEach(el => {
    el.addEventListener("click", (e) => { e.preventDefault(); openCategory(el.getAttribute("data-open-cat")); });

  document.querySelectorAll("[data-open-hit]").forEach(el => {

      await sb.from("kb_categories").delete().eq("id", el.getAttribute("data-del-card"));
      loadCategories();
    });
  });
}

function skeletonCards() {
  return `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
    ${[1,2,3,4,5,6].map(() => `<div class="shimmer rounded-2xl h-32 border border-[var(--border)]"></div>`).join("")}
  </div>`;
}

function openCardModal(card) {
  const isNew = !card.id;
  const root = document.getElementById("modal-root");
  let icon = card.icon || "📁";
  root.innerHTML = `
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/65 backdrop-blur-sm p-4 fade-in-fast">
    <div class="panel rounded-2xl shadow-2xl w-full max-w-md p-6 relative pop-in">
      <button id="close-modal" class="absolute left-4 top-4 text-[var(--muted)] hover:text-[var(--ink)] transition">✕</button>
      <h2 class="title-serif text-lg mb-4">${isNew ? "إضافة عنوان جديد" : "تعديل العنوان"}</h2>
      <div class="flex flex-col gap-3">
        <div>
          <label class="text-xs text-[var(--muted)] mb-1 block">الأيقونة</label>
          <div id="emoji-picker" class="flex flex-wrap gap-2">
            ${EMOJIS.map(e => `<button data-emoji="${e}" class="text-xl w-9 h-9 rounded-lg border transition ${e===icon?"border-[var(--accent)] bg-[var(--accent-soft)]":"border-[var(--border)]"}">${e}</button>`).join("")}
          </div>
        </div>
        <div>
          <label class="text-xs text-[var(--muted)] mb-1 block">العنوان</label>
          <input id="card-title" value="${esc(card.title || "")}" class="w-full rounded-xl px-3 py-2.5" placeholder="مثال: السياسات العامة" />
        </div>
        <div>
          <label class="text-xs text-[var(--muted)] mb-1 block">وصف قصير</label>
          <textarea id="card-desc" rows="3" class="w-full rounded-xl px-3 py-2.5" placeholder="وصف مختصر">${esc(card.description || "")}</textarea>
        </div>
        <button id="save-card" class="btn-primary rounded-xl py-2.5 mt-2">حفظ</button>
      </div>
    </div>
  </div>`;
  document.getElementById("close-modal").addEventListener("click", () => root.innerHTML = "");
  document.querySelectorAll("[data-emoji]").forEach(b => b.addEventListener("click", () => {
    icon = b.getAttribute("data-emoji");
    document.querySelectorAll("[data-emoji]").forEach(x => x.className = "text-xl w-9 h-9 rounded-lg border border-[var(--border)] transition");
    b.className = "text-xl w-9 h-9 rounded-lg border border-[var(--accent)] bg-[var(--accent-soft)] transition";
  }));
  document.getElementById("save-card").addEventListener("click", async () => {
    const title = document.getElementById("card-title").value.trim();
    const description = document.getElementById("card-desc").value.trim();
    if (!title) return;
    if (card.id) {
      await sb.from("kb_categories").update({ title, description, icon }).eq("id", card.id);
    } else {
      await sb.from("kb_categories").insert({ title, description, icon, position: state.categories.length });
    }
    root.innerHTML = "";
    loadCategories();
  });
}

/* ========================= صفحة تفاصيل العنوان ========================= */
async function openCategory(id, focusSectionId) {
  setState({ view: "detail", categoryId: id, loading: true, query: "", openIds: new Set() });
  const { data: cat } = await sb.from("kb_categories").select("*").eq("id", id).single();
  const { data: secs } = await sb.from("kb_sections").select("*, kb_files(*)").eq("category_id", id).order("position", { ascending: true });
  if (focusSectionId) state.openIds.add(focusSectionId);
  setState({ currentCategory: cat, sections: secs || [], loading: false });
  if (focusSectionId) {
    setTimeout(() => {
      const el = document.querySelector(`[data-section="${focusSectionId}"]`);
      if (el) { el.scrollIntoView({ behavior: "smooth", block: "center" }); el.animate([{boxShadow:"0 0 0 3px rgba(184,147,90,.5)"},{boxShadow:"0 0 0 0 rgba(184,147,90,0)"}], {duration:1200}); }
    }, 150);
  }
}

function filteredSections() {
  const q = state.query.trim().toLowerCase();
  if (!q) return state.sections;
  return state.sections.filter(s => {
    const text = (s.content_text || "").toLowerCase();
    return (s.title || "").toLowerCase().includes(q) || text.includes(q);
  });
}

function renderDetail() {
  const cat = state.currentCategory;
  const q = state.query.trim();
  const list = filteredSections();
  app.innerHTML = `
  <header class="panel sticky top-0 z-30 border-b border-[var(--border)]">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <button id="back-btn" class="flex items-center gap-1 text-[var(--muted)] hover:text-[var(--ink)] text-sm transition">→ رجوع</button>
      <div class="flex items-center gap-2 title-serif"><span class="text-xl">${esc(cat?.icon)}</span><span>${esc(cat?.title)}</span></div>
      ${state.editMode
        ? `<button id="end-edit2" class="btn-ghost text-sm rounded-xl px-3 py-2">إنهاء</button>`
        : `<button id="ask-edit2" class="btn-outline-accent text-sm rounded-xl px-3 py-2">تعديل</button>`}
    </div>
    <div class="max-w-3xl mx-auto px-4 pb-4">
      <div class="relative">
        <svg class="absolute top-1/2 -translate-y-1/2 right-4 text-[var(--muted)]" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search-sec" value="${esc(state.query)}" placeholder="ابحث داخل ${esc(cat?.title || "")}..."
          class="w-full rounded-xl pr-11 pl-4 py-3" />
      </div>
    </div>
  </header>
  <main class="max-w-3xl mx-auto w-full px-4 py-7 flex-1 flex flex-col gap-3">
    ${state.editMode ? `<button id="add-sec" class="btn-primary rounded-xl px-4 py-2.5 text-sm w-fit">+ إضافة سيكشن جديد</button>` : ""}
    <div id="sections-list" class="flex flex-col gap-3 stagger">
      ${state.loading ? [1,2,3].map(() => `<div class="shimmer rounded-2xl h-16 border border-[var(--border)]"></div>`).join("")
        : list.length === 0 ? `<p class="text-[var(--muted)] text-center py-16 fade-in">لا توجد نتائج</p>`
        : list.map((sec, i) => sectionHTML(sec, q, i)).join("")}
    </div>
  </main>
  <div id="modal-root"></div>
  `;

  document.getElementById("back-btn").addEventListener("click", () => loadCategories());
  document.getElementById("search-sec").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderDetail();
    const el = document.getElementById("search-sec");
    el.focus(); el.selectionStart = el.selectionEnd = el.value.length;
  });
  const askEdit2 = document.getElementById("ask-edit2");
  if (askEdit2) askEdit2.addEventListener("click", () => openPasswordModal(() => setState({ editMode: true })));
  const endEdit2 = document.getElementById("end-edit2");
  if (endEdit2) endEdit2.addEventListener("click", () => setState({ editMode: false }));
  const addSec = document.getElementById("add-sec");
  if (addSec) addSec.addEventListener("click", addNewSectionInline);

  wireSectionEvents();
}

function sectionHTML(sec, q, i) {
  const open = state.openIds.has(sec.id);
  const files = sec.kb_files || [];
  return `
  <div class="card rounded-2xl overflow-hidden" data-section="${sec.id}" style="animation-delay:${i*40}ms">
    <div class="flex items-center justify-between gap-2 px-5 py-4 cursor-pointer select-none" data-toggle="${sec.id}">
      ${state.editMode
        ? `<input data-title-input="${sec.id}" value="${esc(sec.title)}" class="font-semibold bg-transparent border-b border-dashed border-[var(--border)] focus:outline-none focus:border-[var(--accent)] flex-1 py-1" />`
        : `<h3 class="font-semibold">${q ? highlightText(sec.title, q) : esc(sec.title)}</h3>`}
      <div class="flex items-center gap-2 shrink-0">
        ${state.editMode ? `<button data-del-sec="${sec.id}" class="text-[var(--muted)] hover:text-[var(--danger)] p-1 transition">✕</button>` : ""}
        <span class="chevron text-[var(--muted)] inline-block" style="transform:rotate(${open?180:0}deg)">▾</span>
      </div>
    </div>
    <div class="accordion-content" style="max-height:${open?6000:0}px; opacity:${open?1:0}">
      <div class="border-t border-[var(--border)] px-5 py-4">
        <div class="border border-[var(--border)] rounded-xl overflow-visible bg-[var(--surface2)] relative">
          ${state.editMode ? toolbarHTML(sec.id) : ""}
          <div class="rte" contenteditable="${state.editMode}" data-rte="${sec.id}" dir="auto">${sec.content_html || "<p></p>"}</div>
        </div>
        ${(files.length > 0 || state.editMode) ? `
        <div class="mt-4">
          <div class="flex flex-wrap gap-3" data-files="${sec.id}">
            ${files.map(f => filePreviewHTML(f)).join("")}
          </div>
          ${state.editMode ? `
          <div class="mt-3">
            <input type="file" data-upload-input="${sec.id}" class="hidden" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" />
            <button data-upload-btn="${sec.id}" class="flex items-center gap-2 text-sm border border-dashed border-[var(--border)] hover:border-[var(--accent)] hover:text-[var(--accent-strong)] rounded-xl px-4 py-2 text-[var(--muted)] transition">
              📎 إضافة صورة / فيديو / ملف
            </button>
          </div>` : ""}
        </div>` : ""}
      </div>
    </div>
  </div>`;
}

function toolbarHTML(sid) {
  return `
  <div class="flex flex-wrap items-center gap-1 border-b border-[var(--border)] bg-black/25 p-2 relative" data-toolbar="${sid}">
    <button class="toolbtn" data-cmd="bold" title="عريض"><b>B</b></button>
    <button class="toolbtn" data-cmd="italic" title="مائل"><i>I</i></button>
    <button class="toolbtn" data-cmd="underline" title="تحته خط"><u>U</u></button>
    <button class="toolbtn" data-cmd="insertUnorderedList" title="نقاط">• —</button>
    <button class="toolbtn" data-cmd="insertOrderedList" title="مرقمة">1.</button>
    <button class="toolbtn" data-cmd="formatBlock" data-val="blockquote" title="اقتباس">❝</button>
    <button class="toolbtn" data-table-btn="${sid}" title="إدراج جدول">▦</button>
    <span class="w-px h-6 bg-[var(--border)] mx-1"></span>
    <button class="toolbtn" data-cmd="justifyRight" title="محاذاة يمين">⇥</button>
    <button class="toolbtn" data-cmd="justifyCenter" title="محاذاة وسط">≡</button>
    <button class="toolbtn" data-cmd="justifyLeft" title="محاذاة يسار">⇤</button>
    <span class="w-px h-6 bg-[var(--border)] mx-1"></span>
    <label class="flex items-center gap-1 text-xs text-[var(--muted)] cursor-pointer" title="لون النص">
      🎨 <input type="color" data-color="${sid}" class="w-6 h-6 p-0 cursor-pointer" />
    </label>
    <label class="flex items-center gap-1 text-xs text-[var(--muted)] cursor-pointer" title="تظليل">
      🖍 <input type="color" data-highlight="${sid}" class="w-6 h-6 p-0 cursor-pointer" />
    </label>
    <select class="text-xs rounded-lg px-2 py-1.5 border border-[var(--border)]" data-fontsize="${sid}">
      <option value="" disabled selected>حجم الخط</option>
      <option value="2">صغير</option>
      <option value="3">عادي</option>
      <option value="4">متوسط</option>
      <option value="5">كبير</option>
      <option value="6">كبير جداً</option>
    </select>
    <span class="w-px h-6 bg-[var(--border)] mx-1"></span>
    <button class="toolbtn" data-cmd="undo" title="تراجع">↶</button>
    <button class="toolbtn" data-cmd="redo" title="إعادة">↷</button>
    <div id="table-pop-${sid}"></div>
  </div>`;
}

function filePreviewHTML(f) {
  const inner = f.file_type === "image"
    ? `<img src="${esc(f.url)}" alt="${esc(f.name)}" class="w-28 h-20 object-cover" />`
    : f.file_type === "video"
      ? `<div class="w-28 h-20 bg-black/30 flex items-center justify-center text-[var(--muted)] text-2xl">🎬</div>`
      : `<div class="w-28 h-20 bg-black/30 flex items-center justify-center text-[var(--muted)] text-2xl">📄</div>`;
  return `
  <div class="relative group border border-[var(--border)] rounded-xl overflow-hidden w-28 transition hover:border-[var(--accent)]">
    ${state.editMode ? `<button data-del-file="${f.id}" class="absolute top-1 left-1 bg-black/60 backdrop-blur rounded-md p-1 text-[var(--muted)] hover:text-[var(--danger)] z-10 transition">✕</button>` : ""}
    <a href="${esc(f.url)}" target="_blank" rel="noreferrer" class="block">
      ${inner}
      <p class="text-[10px] text-[var(--muted)] px-1 py-1 truncate">${esc(f.name)}</p>
    </a>
  </div>`;
}

function addNewSectionInline() {
  const container = document.getElementById("sections-list");
  const div = document.createElement("div");
  div.className = "panel rounded-2xl p-4 flex gap-2 items-center pop-in";
  div.style.borderColor = "var(--accent)";
  div.innerHTML = `
    <input id="new-sec-title" autofocus placeholder="عنوان السيكشن الجديد" class="flex-1 rounded-xl px-3 py-2.5" />
    <button id="new-sec-add" class="btn-primary rounded-xl px-4 py-2.5 text-sm">إضافة</button>
    <button id="new-sec-cancel" class="text-[var(--muted)] hover:text-[var(--ink)] px-2 transition">✕</button>
  `;
  container.prepend(div);
  document.getElementById("new-sec-title").focus();
  document.getElementById("new-sec-cancel").addEventListener("click", () => div.remove());
  document.getElementById("new-sec-add").addEventListener("click", async () => {
    const title = document.getElementById("new-sec-title").value.trim() || "سيكشن جديد";
    const { data } = await sb.from("kb_sections").insert({
      category_id: state.categoryId, title, content_html: "<p></p>", content_text: "",
      position: state.sections.length,
    }).select().single();
    if (data) state.openIds.add(data.id);
    await refreshSections();
  });
}

async function refreshSections() {
  const { data: secs } = await sb.from("kb_sections").select("*, kb_files(*)").eq("category_id", state.categoryId).order("position", { ascending: true });
  state.sections = secs || [];
  renderDetail();
}

function buildTableHTML(rows, cols) {
  let html = "<table>";
  for (let r = 0; r < rows; r++) {
    html += "<tr>";
    for (let c = 0; c < cols; c++) {
      html += r === 0 ? "<th>عنوان</th>" : "<td>&nbsp;</td>";
    }
    html += "</tr>";
  }
  html += "</table><p><br></p>";
  return html;
}

function openTablePopover(sid, anchorBtn) {
  document.querySelectorAll(".table-popover").forEach(p => p.remove());
  const pop = document.createElement("div");
  pop.className = "table-popover panel rounded-xl p-3 pop-in shadow-2xl";
  pop.style.top = (anchorBtn.offsetTop + 34) + "px";
  pop.style.right = "8px";
  pop.innerHTML = `
    <p class="text-xs text-[var(--muted)] mb-2">إدراج جدول</p>
    <div class="flex items-center gap-2 mb-2">
      <input type="number" min="1" max="12" value="3" id="tbl-rows-${sid}" class="w-16 rounded-lg px-2 py-1.5 text-sm" />
      <span class="text-xs text-[var(--muted)]">صفوف</span>
      <input type="number" min="1" max="10" value="3" id="tbl-cols-${sid}" class="w-16 rounded-lg px-2 py-1.5 text-sm" />
      <span class="text-xs text-[var(--muted)]">أعمدة</span>
    </div>
    <button id="tbl-insert-${sid}" class="btn-primary rounded-lg px-3 py-1.5 text-xs w-full">إدراج</button>
  `;
  anchorBtn.closest("[data-toolbar]").appendChild(pop);
  document.getElementById(`tbl-insert-${sid}`).addEventListener("click", () => {
    const rows = parseInt(document.getElementById(`tbl-rows-${sid}`).value) || 3;
    const cols = parseInt(document.getElementById(`tbl-cols-${sid}`).value) || 3;
    const rte = document.querySelector(`[data-rte="${sid}"]`);
    rte.focus();
    document.execCommand("insertHTML", false, buildTableHTML(rows, cols));
    rte.dispatchEvent(new Event("input"));
    pop.remove();
  });
  setTimeout(() => {
    document.addEventListener("click", function closeOnce(e) {
      if (!pop.contains(e.target) && e.target !== anchorBtn) {
        pop.remove();
        document.removeEventListener("click", closeOnce);
      }
    });
  }, 10);
}

function wireSectionEvents() {
  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-title-input]") || e.target.closest("[data-del-sec]")) return;
      const id = el.getAttribute("data-toggle");
      if (state.openIds.has(id)) state.openIds.delete(id); else state.openIds.add(id);
      renderDetail();
    });
  });

  document.querySelectorAll("[data-title-input]").forEach(el => {
    el.addEventListener("click", e => e.stopPropagation());
    el.addEventListener("blur", async () => {
      const id = el.getAttribute("data-title-input");
      const sec = state.sections.find(s => s.id === id);
      if (sec && el.value !== sec.title) {
        await sb.from("kb_sections").update({ title: el.value }).eq("id", id);
        sec.title = el.value;
      }
    });
  });

  document.querySelectorAll("[data-del-sec]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("متأكد من حذف هذا السيكشن؟")) return;
      await sb.from("kb_sections").delete().eq("id", el.getAttribute("data-del-sec"));
      await refreshSections();
    });
  });

  document.querySelectorAll("[data-rte]").forEach(el => {
    const sid = el.getAttribute("data-rte");
    let saveTimer;
    el.addEventListener("input", () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        const html = el.innerHTML;
        const text = el.innerText || "";
        await sb.from("kb_sections").update({ content_html: html, content_text: text, updated_at: new Date().toISOString() }).eq("id", sid);
        const sec = state.sections.find(s => s.id === sid);
        if (sec) { sec.content_html = html; sec.content_text = text; }
      }, 800);
    });
  });

  document.querySelectorAll("[data-toolbar]").forEach(bar => {
    const sid = bar.getAttribute("data-toolbar");
    const rte = document.querySelector(`[data-rte="${sid}"]`);
    bar.querySelectorAll("[data-cmd]").forEach(btn => {
      btn.addEventListener("click", () => {
        rte.focus();
        const cmd = btn.getAttribute("data-cmd");
        const val = btn.getAttribute("data-val") || undefined;
        document.execCommand(cmd, false, val);
        rte.dispatchEvent(new Event("input"));
      });
    });
    const tblBtn = bar.querySelector(`[data-table-btn="${sid}"]`);
    if (tblBtn) tblBtn.addEventListener("click", (e) => { e.stopPropagation(); openTablePopover(sid, tblBtn); });
    const colorInput = bar.querySelector(`[data-color="${sid}"]`);
    if (colorInput) colorInput.addEventListener("input", () => {
      rte.focus(); document.execCommand("foreColor", false, colorInput.value); rte.dispatchEvent(new Event("input"));
    });
    const hlInput = bar.querySelector(`[data-highlight="${sid}"]`);
    if (hlInput) hlInput.addEventListener("input", () => {
      rte.focus(); document.execCommand("hiliteColor", false, hlInput.value); rte.dispatchEvent(new Event("input"));
    });
    const fsSelect = bar.querySelector(`[data-fontsize="${sid}"]`);
    if (fsSelect) fsSelect.addEventListener("change", () => {
      rte.focus(); document.execCommand("fontSize", false, fsSelect.value); rte.dispatchEvent(new Event("input"));
    });
  });

  document.querySelectorAll("[data-upload-btn]").forEach(btn => {
    const sid = btn.getAttribute("data-upload-btn");
    const input = document.querySelector(`[data-upload-input="${sid}"]`);
    btn.addEventListener("click", () => input.click());
    input.addEventListener("change", async () => {
      const file = input.files?.[0];
      if (!file) return;
      btn.innerHTML = "⏳ جارِ الرفع...";
      const ext = file.name.split(".").pop();
      const path = `${sid}/${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from("kb-files").upload(path, file);
      if (!upErr) {
        const { data: pub } = sb.storage.from("kb-files").getPublicUrl(path);
        let fileType = "file";
        if (file.type.startsWith("image/")) fileType = "image";
        else if (file.type.startsWith("video/")) fileType = "video";
        await sb.from("kb_files").insert({ section_id: sid, url: pub.publicUrl, name: file.name, file_type: fileType });
        state.openIds.add(sid);
        await refreshSections();
      } else {
        alert("فشل رفع الملف: " + upErr.message);
        btn.innerHTML = "📎 إضافة صورة / فيديو / ملف";
      }
    });
  });

  document.querySelectorAll("[data-del-file]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault(); e.stopPropagation();
      const sid = el.closest("[data-section]").getAttribute("data-section");
      await sb.from("kb_files").delete().eq("id", el.getAttribute("data-del-file"));
      state.openIds.add(sid);
      await refreshSections();
    });
  });
}

/* ========================= مودال باسوورد التعديل ========================= */
function openPasswordModal(onSuccess) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/65 backdrop-blur-sm p-4 fade-in-fast">
    <div class="panel rounded-2xl shadow-2xl w-full max-w-sm p-6 relative pop-in">
      <button id="close-pw" class="absolute left-4 top-4 text-[var(--muted)] hover:text-[var(--ink)] transition">✕</button>
      <div class="flex flex-col items-center text-center gap-3 mb-4">
        <div class="brand-mark text-xl">🔒</div>
        <h2 class="title-serif text-lg">تفعيل وضع التعديل</h2>
        <p class="text-sm text-[var(--muted)]">أدخل كلمة المرور للمتابعة</p>
      </div>
      <form id="pw-form" class="flex flex-col gap-3">
        <input id="pw-input" type="password" autofocus placeholder="••••"
          class="rounded-xl px-4 py-3 text-center tracking-[0.3em] text-lg" />
        <p id="pw-error" class="text-[var(--danger)] text-sm text-center hidden">الرمز غير صحيح، حاول مرة أخرى</p>
        <button class="btn-primary rounded-xl py-2.5">دخول</button>
      </form>
    </div>
  </div>`;
  document.getElementById("close-pw").addEventListener("click", () => root.innerHTML = "");
  document.getElementById("pw-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const val = document.getElementById("pw-input").value;
    if (val === EDIT_PASSWORD) {
      root.innerHTML = "";
      onSuccess();
    } else {
      const err = document.getElementById("pw-error");
      err.classList.remove("hidden");
      const box = document.getElementById("pw-input");
      box.animate([{transform:"translateX(-6px)"},{transform:"translateX(6px)"},{transform:"translateX(0)"}], {duration:250});
    }
  });
}

/* ========================= التحكم بالعرض ========================= */
function render() {
  if (state.view === "gate") return renderGate();
  if (state.view === "categories") return renderCategories();
  if (state.view === "detail") return renderDetail();
}

if (state.view === "categories") {
  loadCategories();
} else {
  render();
}
</script>
</body>
</html>
