<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>قاعدة المعرفة</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body { font-family: "Tahoma","Segoe UI","Cairo",system-ui,-apple-system,sans-serif; background:#f9fafb; }
  .accordion-content { overflow:hidden; transition:max-height .35s ease, opacity .25s ease; }
  .rte { min-height:120px; padding:12px 16px; outline:none; line-height:2; }
  .rte ul { list-style:disc; padding-inline-start:1.5rem; }
  .rte ol { list-style:decimal; padding-inline-start:1.5rem; }
  .rte img { max-width:100%; border-radius:.75rem; margin:.5rem 0; }
  .rte blockquote { border-inline-start:3px solid #a5b4fc; padding-inline-start:1rem; color:#4b5563; font-style:italic; }
  .toolbtn { padding:6px; border-radius:8px; color:#4b5563; }
  .toolbtn:hover { background:#e5e7eb; }
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#d1d5db;border-radius:999px;}
  .fade-in { animation: fadeIn .2s ease; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(4px);} to{opacity:1;transform:translateY(0);} }
</style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

<div id="app" class="flex-1 flex flex-col"></div>

<script>
/* ========================= إعدادات ========================= */
const SUPABASE_URL = "https://uxuxqmwpsokylsyndjcx.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4dXhxbXdwc29reWxzeW5kamN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDgzMzUsImV4cCI6MjEwMjQ4NDMzNX0.KTXgsjAkbfEAxx1_Dr1E5Jjs0Y5N8enoVNcccasARvk";
const ACCESS_CODE = "KB013";
const EDIT_PASSWORD = "0123";
const EMOJIS = ["📁","📋","💻","📞","💰","🛠️","📦","🧾","👥","🏢","⚙️","📚"];

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

/* ========================= الحالة العامة ========================= */
let state = {
  view: sessionStorage.getItem("kb_access_ok") === "true" ? "categories" : "gate",
  categoryId: null,
  categories: [],
  sections: [],
  currentCategory: null,
  query: "",
  editMode: false,
  openIds: new Set(),
  loading: false,
};

const app = document.getElementById("app");

function setState(patch) {
  Object.assign(state, patch);
  render();
}

function esc(str) {
  if (str == null) return "";
  return String(str).replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

/* ========================= صفحة الدخول ========================= */
function renderGate() {
  app.innerHTML = `
  <div class="flex-1 flex items-center justify-center p-4">
    <div class="w-full max-w-sm bg-white rounded-2xl shadow-lg p-8 flex flex-col items-center gap-4 fade-in">
      <div class="bg-indigo-100 text-indigo-600 rounded-full p-4 text-3xl">📚</div>
      <h1 class="text-xl font-bold text-gray-800">قاعدة المعرفة</h1>
      <p class="text-sm text-gray-500 text-center">أدخل رمز الدخول لعرض المعلومات</p>
      <form id="gate-form" class="w-full flex flex-col gap-3 mt-2">
        <input id="gate-input" autofocus placeholder="ادخل الرمز"
          class="w-full border border-gray-300 rounded-xl px-4 py-2.5 text-center tracking-widest uppercase focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <p id="gate-error" class="text-red-500 text-sm text-center hidden">الرمز غير صحيح، حاول مرة أخرى</p>
        <button class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2.5 font-semibold transition">دخول</button>
      </form>
    </div>
  </div>`;
  document.getElementById("gate-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const val = document.getElementById("gate-input").value.trim().toUpperCase();
    if (val === ACCESS_CODE) {
      sessionStorage.setItem("kb_access_ok", "true");
      loadCategories();
    } else {
      document.getElementById("gate-error").classList.remove("hidden");
    }
  });
}

/* ========================= صفحة الكاردات ========================= */
async function loadCategories() {
  setState({ view: "categories", loading: true });
  const { data, error } = await sb.from("kb_categories").select("*").order("position", { ascending: true });
  setState({ categories: data || [], loading: false });
}

function filteredCategories() {
  const q = state.query.trim().toLowerCase();
  if (!q) return state.categories;
  return state.categories.filter(c =>
    (c.title || "").toLowerCase().includes(q) || (c.description || "").toLowerCase().includes(q)
  );
}

function renderCategories() {
  const list = filteredCategories();
  app.innerHTML = `
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2 text-indigo-600 font-bold"><span>📚</span><span>قاعدة المعرفة</span></div>
      <div class="flex items-center gap-2">
        ${state.editMode
          ? `<button id="end-edit" class="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm rounded-lg px-3 py-1.5">✕ إنهاء التعديل</button>`
          : `<button id="ask-edit" class="flex items-center gap-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-sm rounded-lg px-3 py-1.5">✏️ تعديل</button>`}
        <button id="logout" title="خروج" class="text-gray-400 hover:text-red-500 text-sm rounded-lg px-2 py-1.5">⏻</button>
      </div>
    </div>
    <div class="max-w-5xl mx-auto px-4 pb-4">
      <div class="relative">
        <span class="absolute top-1/2 -translate-y-1/2 right-3 text-gray-400">🔍</span>
        <input id="search-cat" value="${esc(state.query)}" placeholder="ابحث عن عنوان..."
          class="w-full border border-gray-300 rounded-xl pr-10 pl-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
    </div>
  </header>
  <main class="max-w-5xl mx-auto w-full px-4 py-6 flex-1">
    ${state.editMode ? `<button id="add-card" class="mb-4 flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-4 py-2 text-sm font-semibold">➕ إضافة عنوان جديد</button>` : ""}
    ${state.loading ? `<p class="text-gray-400 text-center py-10">جارِ التحميل...</p>`
      : list.length === 0 ? `<p class="text-gray-400 text-center py-10">لا توجد نتائج</p>`
      : `<div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
          ${list.map(cat => `
            <div class="relative group">
              <a href="#" data-open-cat="${cat.id}" class="block bg-white rounded-2xl shadow-sm hover:shadow-md border border-gray-100 p-5 transition h-full">
                <div class="text-3xl mb-3">${esc(cat.icon || "📁")}</div>
                <h3 class="font-bold text-gray-800 mb-1">${esc(cat.title)}</h3>
                <p class="text-sm text-gray-500 line-clamp-2">${esc(cat.description || "")}</p>
              </a>
              ${state.editMode ? `
                <div class="absolute top-3 left-3 flex gap-1">
                  <button data-edit-card="${cat.id}" class="bg-white shadow rounded-lg p-1.5 text-gray-500 hover:text-indigo-600">✏️</button>
                  <button data-del-card="${cat.id}" class="bg-white shadow rounded-lg p-1.5 text-gray-500 hover:text-red-500">🗑️</button>
                </div>` : ""}
            </div>`).join("")}
        </div>`}
  </main>
  <div id="modal-root"></div>
  `;

  document.getElementById("search-cat").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderCategories();
    document.getElementById("search-cat").focus();
    const el = document.getElementById("search-cat");
    el.selectionStart = el.selectionEnd = el.value.length;
  });
  document.getElementById("logout").addEventListener("click", () => {
    sessionStorage.removeItem("kb_access_ok");
    setState({ view: "gate", editMode: false });
  });
  const askEdit = document.getElementById("ask-edit");
  if (askEdit) askEdit.addEventListener("click", () => openPasswordModal(() => setState({ editMode: true })));
  const endEdit = document.getElementById("end-edit");
  if (endEdit) endEdit.addEventListener("click", () => setState({ editMode: false }));
  const addCard = document.getElementById("add-card");
  if (addCard) addCard.addEventListener("click", () => openCardModal({}));

  document.querySelectorAll("[data-open-cat]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      openCategory(el.getAttribute("data-open-cat"));
    });
  });
  document.querySelectorAll("[data-edit-card]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault(); e.stopPropagation();
      const cat = state.categories.find(c => c.id === el.getAttribute("data-edit-card"));
      openCardModal(cat);
    });
  });
  document.querySelectorAll("[data-del-card]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault(); e.stopPropagation();
      if (!confirm("متأكد من حذف هذا العنوان وكل ما بداخله؟")) return;
      await sb.from("kb_categories").delete().eq("id", el.getAttribute("data-del-card"));
      loadCategories();
    });
  });
}

function openCardModal(card) {
  const isNew = !card.id;
  const root = document.getElementById("modal-root");
  let icon = card.icon || "📁";
  root.innerHTML = `
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-md p-6 relative">
      <button id="close-modal" class="absolute left-4 top-4 text-gray-400 hover:text-gray-600">✕</button>
      <h2 class="font-bold text-gray-800 mb-4">${isNew ? "إضافة عنوان جديد" : "تعديل العنوان"}</h2>
      <div class="flex flex-col gap-3">
        <div>
          <label class="text-xs text-gray-500 mb-1 block">الأيقونة</label>
          <div id="emoji-picker" class="flex flex-wrap gap-2">
            ${EMOJIS.map(e => `<button data-emoji="${e}" class="text-xl w-9 h-9 rounded-lg border ${e===icon?"border-indigo-500 bg-indigo-50":"border-gray-200"}">${e}</button>`).join("")}
          </div>
        </div>
        <div>
          <label class="text-xs text-gray-500 mb-1 block">العنوان</label>
          <input id="card-title" value="${esc(card.title || "")}" class="w-full border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="مثال: السياسات العامة" />
        </div>
        <div>
          <label class="text-xs text-gray-500 mb-1 block">وصف قصير</label>
          <textarea id="card-desc" rows="3" class="w-full border border-gray-300 rounded-xl px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" placeholder="وصف مختصر">${esc(card.description || "")}</textarea>
        </div>
        <button id="save-card" class="flex items-center justify-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2.5 font-semibold mt-2">💾 حفظ</button>
      </div>
    </div>
  </div>`;
  document.getElementById("close-modal").addEventListener("click", () => root.innerHTML = "");
  document.querySelectorAll("[data-emoji]").forEach(b => b.addEventListener("click", () => {
    icon = b.getAttribute("data-emoji");
    document.querySelectorAll("[data-emoji]").forEach(x => x.className = "text-xl w-9 h-9 rounded-lg border border-gray-200");
    b.className = "text-xl w-9 h-9 rounded-lg border border-indigo-500 bg-indigo-50";
  }));
  document.getElementById("save-card").addEventListener("click", async () => {
    const title = document.getElementById("card-title").value.trim();
    const description = document.getElementById("card-desc").value.trim();
    if (!title) return;
    if (card.id) {
      await sb.from("kb_categories").update({ title, description, icon }).eq("id", card.id);
    } else {
      await sb.from("kb_categories").insert({ title, description, icon, position: state.categories.length });
    }
    root.innerHTML = "";
    loadCategories();
  });
}

/* ========================= صفحة تفاصيل العنوان (السيكشنات) ========================= */
async function openCategory(id) {
  setState({ view: "detail", categoryId: id, loading: true, query: "", openIds: new Set() });
  const { data: cat } = await sb.from("kb_categories").select("*").eq("id", id).single();
  const { data: secs } = await sb.from("kb_sections").select("*, kb_files(*)").eq("category_id", id).order("position", { ascending: true });
  setState({ currentCategory: cat, sections: secs || [], loading: false });
}

function filteredSections() {
  const q = state.query.trim().toLowerCase();
  if (!q) return state.sections;
  return state.sections.filter(s => {
    const text = (s.content_text || "").toLowerCase();
    return (s.title || "").toLowerCase().includes(q) || text.includes(q);
  });
}

function renderDetail() {
  const cat = state.currentCategory;
  const list = filteredSections();
  app.innerHTML = `
  <header class="bg-white border-b border-gray-200 sticky top-0 z-30">
    <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between gap-3">
      <button id="back-btn" class="flex items-center gap-1 text-gray-500 hover:text-indigo-600 text-sm">→ رجوع</button>
      <div class="flex items-center gap-2 font-bold text-gray-800"><span class="text-xl">${esc(cat?.icon)}</span><span>${esc(cat?.title)}</span></div>
      ${state.editMode
        ? `<button id="end-edit2" class="flex items-center gap-1 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm rounded-lg px-3 py-1.5">✕ إنهاء</button>`
        : `<button id="ask-edit2" class="flex items-center gap-1 bg-indigo-50 hover:bg-indigo-100 text-indigo-600 text-sm rounded-lg px-3 py-1.5">✏️ تعديل</button>`}
    </div>
    <div class="max-w-3xl mx-auto px-4 pb-4">
      <div class="relative">
        <span class="absolute top-1/2 -translate-y-1/2 right-3 text-gray-400">🔍</span>
        <input id="search-sec" value="${esc(state.query)}" placeholder="ابحث داخل ${esc(cat?.title || "")}..."
          class="w-full border border-gray-300 rounded-xl pr-10 pl-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
      </div>
    </div>
  </header>
  <main class="max-w-3xl mx-auto w-full px-4 py-6 flex-1 flex flex-col gap-3">
    ${state.editMode ? `<button id="add-sec" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl px-4 py-2 text-sm font-semibold w-fit">➕ إضافة سيكشن جديد</button>` : ""}
    <div id="sections-list" class="flex flex-col gap-3">
      ${state.loading ? `<p class="text-gray-400 text-center py-10">جارِ التحميل...</p>`
        : list.length === 0 ? `<p class="text-gray-400 text-center py-10">لا توجد نتائج</p>`
        : list.map(sec => sectionHTML(sec)).join("")}
    </div>
  </main>
  <div id="modal-root"></div>
  `;

  document.getElementById("back-btn").addEventListener("click", () => loadCategories());
  document.getElementById("search-sec").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderDetail();
    const el = document.getElementById("search-sec");
    el.focus(); el.selectionStart = el.selectionEnd = el.value.length;
  });
  const askEdit2 = document.getElementById("ask-edit2");
  if (askEdit2) askEdit2.addEventListener("click", () => openPasswordModal(() => setState({ editMode: true })));
  const endEdit2 = document.getElementById("end-edit2");
  if (endEdit2) endEdit2.addEventListener("click", () => setState({ editMode: false }));
  const addSec = document.getElementById("add-sec");
  if (addSec) addSec.addEventListener("click", addNewSectionInline);

  wireSectionEvents();
}

function sectionHTML(sec) {
  const open = state.openIds.has(sec.id);
  const files = sec.kb_files || [];
  return `
  <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden" data-section="${sec.id}">
    <div class="flex items-center justify-between gap-2 px-5 py-4 cursor-pointer select-none" data-toggle="${sec.id}">
      ${state.editMode
        ? `<input data-title-input="${sec.id}" value="${esc(sec.title)}" class="font-semibold text-gray-800 bg-transparent border-b border-dashed border-gray-300 focus:outline-none focus:border-indigo-400 flex-1" />`
        : `<h3 class="font-semibold text-gray-800">${esc(sec.title)}</h3>`}
      <div class="flex items-center gap-2 shrink-0">
        ${state.editMode ? `<button data-del-sec="${sec.id}" class="text-gray-400 hover:text-red-500 p-1">🗑️</button>` : ""}
        <span class="text-gray-400 transition-transform inline-block" style="transform:rotate(${open?180:0}deg)">▼</span>
      </div>
    </div>
    <div class="accordion-content" style="max-height:${open?5000:0}px; opacity:${open?1:0}">
      <div class="border-t border-gray-100 px-5 py-4">
        <div class="border border-gray-200 rounded-xl overflow-hidden bg-white">
          ${state.editMode ? toolbarHTML(sec.id) : ""}
          <div class="rte" contenteditable="${state.editMode}" data-rte="${sec.id}" dir="auto">${sec.content_html || "<p></p>"}</div>
        </div>
        ${(files.length > 0 || state.editMode) ? `
        <div class="mt-4">
          <div class="flex flex-wrap gap-3" data-files="${sec.id}">
            ${files.map(f => filePreviewHTML(f)).join("")}
          </div>
          ${state.editMode ? `
          <div class="mt-3">
            <input type="file" data-upload-input="${sec.id}" class="hidden" accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx" />
            <button data-upload-btn="${sec.id}" class="flex items-center gap-2 text-sm border border-dashed border-gray-300 hover:border-indigo-400 hover:text-indigo-600 rounded-xl px-4 py-2 text-gray-500">
              📎 إضافة صورة / فيديو / ملف
            </button>
          </div>` : ""}
        </div>` : ""}
      </div>
    </div>
  </div>`;
}

function toolbarHTML(sid) {
  return `
  <div class="flex flex-wrap items-center gap-1 border-b border-gray-200 bg-gray-50 p-2" data-toolbar="${sid}">
    <button class="toolbtn" data-cmd="bold" title="عريض"><b>B</b></button>
    <button class="toolbtn" data-cmd="italic" title="مائل"><i>I</i></button>
    <button class="toolbtn" data-cmd="underline" title="تحته خط"><u>U</u></button>
    <button class="toolbtn" data-cmd="insertUnorderedList" title="نقاط">• ‎—</button>
    <button class="toolbtn" data-cmd="insertOrderedList" title="مرقمة">1.</button>
    <button class="toolbtn" data-cmd="formatBlock" data-val="blockquote" title="اقتباس">❝</button>
    <span class="w-px h-6 bg-gray-300 mx-1"></span>
    <button class="toolbtn" data-cmd="justifyRight" title="محاذاة يمين">⇥</button>
    <button class="toolbtn" data-cmd="justifyCenter" title="محاذاة وسط">≡</button>
    <button class="toolbtn" data-cmd="justifyLeft" title="محاذاة يسار">⇤</button>
    <span class="w-px h-6 bg-gray-300 mx-1"></span>
    <label class="flex items-center gap-1 text-xs text-gray-600 cursor-pointer" title="لون النص">
      🎨 <input type="color" data-color="${sid}" class="w-6 h-6 border-0 p-0 bg-transparent cursor-pointer" />
    </label>
    <label class="flex items-center gap-1 text-xs text-gray-600 cursor-pointer" title="تظليل">
      🖍️ <input type="color" data-highlight="${sid}" class="w-6 h-6 border-0 p-0 bg-transparent cursor-pointer" />
    </label>
    <select class="text-xs border border-gray-300 rounded-lg px-1 py-1 bg-white" data-fontsize="${sid}">
      <option value="" disabled selected>حجم الخط</option>
      <option value="2">صغير</option>
      <option value="3">عادي</option>
      <option value="4">متوسط</option>
      <option value="5">كبير</option>
      <option value="6">كبير جداً</option>
    </select>
    <span class="w-px h-6 bg-gray-300 mx-1"></span>
    <button class="toolbtn" data-cmd="undo" title="تراجع">↶</button>
    <button class="toolbtn" data-cmd="redo" title="إعادة">↷</button>
  </div>`;
}

function filePreviewHTML(f) {
  const inner = f.file_type === "image"
    ? `<img src="${esc(f.url)}" alt="${esc(f.name)}" class="w-28 h-20 object-cover" />`
    : f.file_type === "video"
      ? `<div class="w-28 h-20 bg-gray-100 flex items-center justify-center text-gray-400 text-2xl">🎬</div>`
      : `<div class="w-28 h-20 bg-gray-100 flex items-center justify-center text-gray-400 text-2xl">📄</div>`;
  return `
  <div class="relative group border border-gray-200 rounded-xl overflow-hidden w-28">
    ${state.editMode ? `<button data-del-file="${f.id}" class="absolute top-1 left-1 bg-white/90 rounded-md p-1 text-gray-500 hover:text-red-500 z-10">🗑️</button>` : ""}
    <a href="${esc(f.url)}" target="_blank" rel="noreferrer" class="block">
      ${inner}
      <p class="text-[10px] text-gray-500 px-1 py-1 truncate">${esc(f.name)}</p>
    </a>
  </div>`;
}

function addNewSectionInline() {
  const container = document.getElementById("sections-list");
  const div = document.createElement("div");
  div.className = "bg-white border border-indigo-200 rounded-xl p-4 flex gap-2 items-center";
  div.innerHTML = `
    <input id="new-sec-title" autofocus placeholder="عنوان السيكشن الجديد" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-indigo-400" />
    <button id="new-sec-add" class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg px-4 py-2 text-sm">إضافة</button>
    <button id="new-sec-cancel" class="text-gray-400 hover:text-gray-600 px-2">✕</button>
  `;
  container.prepend(div);
  document.getElementById("new-sec-title").focus();
  document.getElementById("new-sec-cancel").addEventListener("click", () => div.remove());
  document.getElementById("new-sec-add").addEventListener("click", async () => {
    const title = document.getElementById("new-sec-title").value.trim() || "سيكشن جديد";
    const { data } = await sb.from("kb_sections").insert({
      category_id: state.categoryId, title, content_html: "<p></p>", content_text: "",
      position: state.sections.length,
    }).select().single();
    if (data) state.openIds.add(data.id);
    await refreshSections();
  });
}

async function refreshSections() {
  const { data: secs } = await sb.from("kb_sections").select("*, kb_files(*)").eq("category_id", state.categoryId).order("position", { ascending: true });
  state.sections = secs || [];
  renderDetail();
}

function wireSectionEvents() {
  document.querySelectorAll("[data-toggle]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (e.target.closest("[data-title-input]") || e.target.closest("[data-del-sec]")) return;
      const id = el.getAttribute("data-toggle");
      if (state.openIds.has(id)) state.openIds.delete(id); else state.openIds.add(id);
      renderDetail();
    });
  });

  document.querySelectorAll("[data-title-input]").forEach(el => {
    el.addEventListener("click", e => e.stopPropagation());
    el.addEventListener("blur", async () => {
      const id = el.getAttribute("data-title-input");
      const sec = state.sections.find(s => s.id === id);
      if (sec && el.value !== sec.title) {
        await sb.from("kb_sections").update({ title: el.value }).eq("id", id);
        sec.title = el.value;
      }
    });
  });

  document.querySelectorAll("[data-del-sec]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      if (!confirm("متأكد من حذف هذا السيكشن؟")) return;
      await sb.from("kb_sections").delete().eq("id", el.getAttribute("data-del-sec"));
      await refreshSections();
    });
  });

  // rich text editors
  document.querySelectorAll("[data-rte]").forEach(el => {
    const sid = el.getAttribute("data-rte");
    let saveTimer;
    el.addEventListener("input", () => {
      clearTimeout(saveTimer);
      saveTimer = setTimeout(async () => {
        const html = el.innerHTML;
        const text = el.innerText || "";
        await sb.from("kb_sections").update({ content_html: html, content_text: text, updated_at: new Date().toISOString() }).eq("id", sid);
        const sec = state.sections.find(s => s.id === sid);
        if (sec) { sec.content_html = html; sec.content_text = text; }
      }, 800);
    });
  });

  // toolbars
  document.querySelectorAll("[data-toolbar]").forEach(bar => {
    const sid = bar.getAttribute("data-toolbar");
    const rte = document.querySelector(`[data-rte="${sid}"]`);
    bar.querySelectorAll("[data-cmd]").forEach(btn => {
      btn.addEventListener("click", () => {
        rte.focus();
        const cmd = btn.getAttribute("data-cmd");
        const val = btn.getAttribute("data-val") || undefined;
        document.execCommand(cmd, false, val);
        rte.dispatchEvent(new Event("input"));
      });
    });
    const colorInput = bar.querySelector(`[data-color="${sid}"]`);
    if (colorInput) colorInput.addEventListener("input", () => {
      rte.focus();
      document.execCommand("foreColor", false, colorInput.value);
      rte.dispatchEvent(new Event("input"));
    });
    const hlInput = bar.querySelector(`[data-highlight="${sid}"]`);
    if (hlInput) hlInput.addEventListener("input", () => {
      rte.focus();
      document.execCommand("hiliteColor", false, hlInput.value);
      rte.dispatchEvent(new Event("input"));
    });
    const fsSelect = bar.querySelector(`[data-fontsize="${sid}"]`);
    if (fsSelect) fsSelect.addEventListener("change", () => {
      rte.focus();
      document.execCommand("fontSize", false, fsSelect.value);
      rte.dispatchEvent(new Event("input"));
    });
  });

  // file upload
  document.querySelectorAll("[data-upload-btn]").forEach(btn => {
    const sid = btn.getAttribute("data-upload-btn");
    const input = document.querySelector(`[data-upload-input="${sid}"]`);
    btn.addEventListener("click", () => input.click());
    input.addEventListener("change", async () => {
      const file = input.files?.[0];
      if (!file) return;
      btn.innerHTML = "⏳ جارِ الرفع...";
      const ext = file.name.split(".").pop();
      const path = `${sid}/${Date.now()}.${ext}`;
      const { error: upErr } = await sb.storage.from("kb-files").upload(path, file);
      if (!upErr) {
        const { data: pub } = sb.storage.from("kb-files").getPublicUrl(path);
        let fileType = "file";
        if (file.type.startsWith("image/")) fileType = "image";
        else if (file.type.startsWith("video/")) fileType = "video";
        await sb.from("kb_files").insert({ section_id: sid, url: pub.publicUrl, name: file.name, file_type: fileType });
        await refreshSections();
        state.openIds.add(sid);
        renderDetail();
      } else {
        alert("فشل رفع الملف: " + upErr.message);
        btn.innerHTML = "📎 إضافة صورة / فيديو / ملف";
      }
    });
  });

  document.querySelectorAll("[data-del-file]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault(); e.stopPropagation();
      await sb.from("kb_files").delete().eq("id", el.getAttribute("data-del-file"));
      await refreshSections();
      state.openIds.add(el.closest("[data-section]").getAttribute("data-section"));
      renderDetail();
    });
  });
}

/* ========================= مودال باسوورد التعديل ========================= */
function openPasswordModal(onSuccess) {
  const root = document.getElementById("modal-root");
  root.innerHTML = `
  <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/50 backdrop-blur-sm p-4">
    <div class="bg-white rounded-2xl shadow-xl w-full max-w-sm p-6 relative">
      <button id="close-pw" class="absolute left-4 top-4 text-gray-400 hover:text-gray-600">✕</button>
      <div class="flex flex-col items-center text-center gap-3 mb-4">
        <div class="bg-indigo-100 text-indigo-600 rounded-full p-3 text-xl">🔒</div>
        <h2 class="text-lg font-bold text-gray-800">تفعيل وضع التعديل</h2>
        <p class="text-sm text-gray-500">أدخل كلمة المرور للمتابعة</p>
      </div>
      <form id="pw-form" class="flex flex-col gap-3">
        <input id="pw-input" type="password" autofocus placeholder="••••"
          class="border border-gray-300 rounded-xl px-4 py-2 text-center tracking-widest focus:outline-none focus:ring-2 focus:ring-indigo-400" />
        <p id="pw-error" class="text-red-500 text-sm text-center hidden">الرمز غير صحيح، حاول مرة أخرى</p>
        <button class="bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-2 font-semibold transition">دخول</button>
      </form>
    </div>
  </div>`;
  document.getElementById("close-pw").addEventListener("click", () => root.innerHTML = "");
  document.getElementById("pw-form").addEventListener("submit", (e) => {
    e.preventDefault();
    const val = document.getElementById("pw-input").value;
    if (val === EDIT_PASSWORD) {
      root.innerHTML = "";
      onSuccess();
    } else {
      document.getElementById("pw-error").classList.remove("hidden");
    }
  });
}

/* ========================= التحكم بالعرض ========================= */
function render() {
  if (state.view === "gate") return renderGate();
  if (state.view === "categories") return renderCategories();
  if (state.view === "detail") return renderDetail();
}

// نقطة الانطلاق
if (state.view === "categories") {
  loadCategories();
} else {
  render();
}
</script>
