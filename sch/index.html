<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>جدولة فريق كول سنتر</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0B0E;
    --surface:#18181D;
    --surface-2:#1F1F26;
    --surface-3:#25252D;
    --ink:#F2F2F5;
    --ink-soft:#9A9AA6;
    --gold:#D8AD5C;
    --gold-soft:#3A311F;
    --teal:#D8AD5C;
    --teal-light:#CDEAE5;
    --coral:#E8896F;
    --amber:#E3B98C;
    --violet:#B9AED9;
    --line:#2A2A32;
    --danger:#E0555B;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Tajawal',sans-serif;
    background:var(--bg);
    color:var(--ink);
    min-height:100vh;
  }
  .topbar{
    background:var(--bg);
    color:var(--ink);
    padding:18px 20px 10px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    flex-wrap:wrap;
    gap:14px;
    max-width:960px;
    margin:0 auto;
  }
  .topbar-brand{display:flex;align-items:center;gap:12px}
  .avatar-box{
    width:52px;height:52px;border-radius:16px;
    background:var(--gold);color:#1a1408;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:20px;flex-shrink:0;
  }
  .topbar h1{
    font-size:19px;
    margin:0;
    font-weight:900;
    color:var(--ink);
  }
  .topbar .sub{font-size:12px;opacity:.65;font-weight:400;margin-top:2px}
  .topbar-actions{display:flex;gap:8px;flex-wrap:wrap}
  .btn{
    border:none;
    border-radius:14px;
    padding:10px 16px;
    font-family:inherit;
    font-weight:700;
    font-size:14px;
    cursor:pointer;
    transition:transform .12s ease, opacity .12s ease, background .12s ease;
  }
  .btn:active{transform:scale(.96)}
  .btn-primary{background:var(--gold);color:#1a1408}
  .btn-ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
  .btn-outline{background:transparent;color:var(--gold);border:1px solid var(--gold)}
  .btn-danger{background:var(--danger);color:#fff}
  .btn-sm{padding:6px 10px;font-size:12px;border-radius:10px}
  .wrap{max-width:960px;margin:0 auto;padding:18px;}
  .card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:20px;
    padding:20px;
    margin-bottom:16px;
    box-shadow:0 4px 18px rgba(0,0,0,.28);
  }
  .card h2{margin:0 0 12px;font-size:16px;color:var(--gold);font-weight:900;}
  .card h3{margin:0 0 8px;font-size:14px;color:var(--ink);font-weight:700;}
  label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px;color:var(--ink-soft)}
  input[type=text],input[type=password],input[type=date],input[type=time],textarea,select{
    width:100%;
    padding:10px 12px;
    border:1px solid var(--line);
    border-radius:12px;
    font-family:inherit;
    font-size:14px;
    background:#101014;
    color:var(--ink);
  }
  input::placeholder,textarea::placeholder{color:#6b6b76}
  select option{background:#18181D;color:var(--ink)}
  input[type=color]{width:44px;height:38px;padding:2px;border:1px solid var(--line);border-radius:10px;background:#101014;cursor:pointer}
  textarea{min-height:70px;resize:vertical}
  .emp-row{
    display:grid;
    grid-template-columns:1fr 2fr 1fr 2fr 0.6fr auto;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .emp-row input,.emp-row select{padding:8px}
  .label-row{
    display:grid;
    grid-template-columns:2fr 0.6fr auto;
    gap:8px;
    align-items:center;
    margin-bottom:8px;
  }
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:4px;line-height:1.6}
  .modal-bg{
    position:fixed;inset:0;background:rgba(0,0,0,.65);
    display:flex;align-items:center;justify-content:center;z-index:50;padding:16px;
    overflow:auto;
  }
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px;max-width:340px;width:100%;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5);color:var(--ink)}
  .modal input[type=password]{text-align:center;font-size:20px;letter-spacing:4px;margin:12px 0}
  .day-block{margin-bottom:18px}
  .day-title{font-weight:900;color:var(--gold);margin-bottom:8px;font-size:14px}
  .shift-grid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
  .shift-card{
    border-radius:16px;padding:12px 14px;color:#211C12;
    border:1px solid rgba(0,0,0,.08);
    box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .shift-card .time{font-weight:900;font-size:13px}
  .shift-card .who{font-size:13px;margin-top:4px;font-weight:700}
  .shift-card .note{font-size:11px;color:#4b4436;margin-top:2px}
  .shift-card.open{border:1.5px dashed #6b6b76;background:var(--surface-2);color:var(--ink)}
  .shift-card.open .note{color:var(--ink-soft)}
  .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;margin-inline-end:4px;margin-top:4px}
  .tag-row{display:flex;flex-wrap:wrap;gap:2px;margin-top:4px}
  .empty{
    text-align:center;padding:40px 16px;color:var(--ink-soft);
  }
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .status{font-size:12px;color:var(--ink-soft);margin-top:6px}
  .loading{display:inline-block;width:14px;height:14px;border:2px solid #1a1408;border-top-color:transparent;border-radius:50%;animation:spin 0.8s linear infinite;vertical-align:middle;margin-inline-end:6px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:12px;color:var(--ink-soft)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
  .pencil-btn{
    position:absolute;top:6px;left:6px;padding:2px 6px;background:rgba(255,255,255,.85);
    border:1px solid rgba(0,0,0,.1);border-radius:8px;cursor:pointer;font-size:12px;line-height:1.4;
  }
  .day-title-row{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .day-pencil{
    border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;padding:4px 8px;
    cursor:pointer;font-size:13px;
  }
  .quick-add-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:10px}
  .quick-add-row select{width:auto;min-width:140px;padding:6px}
  .quick-btn{background:var(--gold-soft);color:var(--gold);border:1px solid var(--gold);border-radius:10px;padding:5px 9px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
  .inline-emp-select{margin-top:6px;padding:4px;font-size:11px}
  .file-row{display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap}
  .file-row input[type=file]{font-size:11px;max-width:180px;color:var(--ink-soft)}
  /* Week view */
  .week-overlay{position:fixed;inset:0;background:var(--bg);z-index:80;overflow:auto;padding:16px}
  .week-grid{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}
  .week-col{border:1px solid var(--line);border-radius:16px;padding:10px;background:var(--surface)}
  .week-col h4{margin:0 0 8px;font-size:13px;text-align:center;color:var(--gold)}
  .week-shift{border-radius:10px;padding:6px 8px;margin-bottom:6px;font-size:11px;border:1px solid rgba(0,0,0,.08);color:#211C12}

  /* Settings tabs (redesigned admin) */
  .settings-shell{background:var(--surface);border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.28);margin-bottom:16px}
  .settings-tabs{display:flex;gap:4px;overflow-x:auto;padding:12px 12px 0;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .settings-tab{
    padding:10px 14px;border-radius:12px 12px 0 0;background:transparent;border:none;
    color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:13px;cursor:pointer;
    white-space:nowrap;display:flex;align-items:center;gap:6px;transition:all .15s;
  }
  .settings-tab .num{
    width:18px;height:18px;border-radius:50%;background:var(--surface-3);color:var(--ink-soft);
    font-size:10px;display:flex;align-items:center;justify-content:center;font-weight:900;flex-shrink:0;
  }
  .settings-tab.active{background:var(--surface);color:var(--gold)}
  .settings-tab.active .num{background:var(--gold);color:#1a1408}
  .settings-body{padding:20px}
  .settings-section{display:none}
  .settings-section.active{display:block}
  .section-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
  .section-icon{
    width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    font-size:18px;background:var(--gold-soft);flex-shrink:0;
  }
  .section-head-text h2{margin:0;font-size:16px;color:var(--gold);font-weight:900}
  .section-head-text .section-sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
  .subcard{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:16px}
  .subcard h3{margin:0 0 4px;font-size:14px;color:var(--ink);font-weight:900;display:flex;align-items:center;gap:6px}
  .dirty-banner{background:var(--gold-soft);border:1px solid var(--gold);color:var(--gold);padding:10px 14px;border-radius:14px;margin-bottom:14px;font-weight:700;font-size:13px}
  .settings-footer{display:flex;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line);background:var(--surface-2);gap:8px;flex-wrap:wrap}

  /* Login gate */
  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;
    background:var(--bg);
  }
  .login-card{
    background:var(--surface);border:1px solid var(--line);border-radius:24px;
    padding:36px 28px;max-width:360px;width:100%;text-align:center;
    box-shadow:0 10px 34px rgba(0,0,0,.4);
  }
  .login-avatar{
    width:64px;height:64px;border-radius:18px;margin:0 auto 18px;
    background:var(--gold);color:#1a1408;
    display:flex;align-items:center;justify-content:center;
    font-weight:900;font-size:26px;
    box-shadow:0 0 26px rgba(216,173,92,.45);
  }
  .login-card h1{font-size:24px;font-weight:900;margin:0 0 14px;color:var(--ink)}
  .login-divider{width:46px;height:2px;background:var(--gold);margin:0 auto 16px;border-radius:2px}
  .login-sub{font-size:13px;color:var(--ink-soft);margin-bottom:22px;line-height:1.7}
  .login-input{
    width:100%;padding:14px 16px;border-radius:14px;
    border:1px solid var(--gold);background:#101014;color:var(--ink);
    font-family:inherit;font-size:15px;text-align:center;letter-spacing:1px;
    margin-bottom:14px;
  }
  .login-input::placeholder{color:var(--ink-soft)}
  .login-btn{
    width:100%;padding:14px;border:none;border-radius:14px;
    background:var(--gold);color:#1a1408;font-family:inherit;font-weight:900;font-size:15px;
    cursor:pointer;transition:transform .12s ease, opacity .12s ease;
  }
  .login-btn:active{transform:scale(.97)}
  .login-error{
    color:var(--danger);font-size:13px;font-weight:700;min-height:18px;margin-bottom:8px;
  }
  #appRoot{display:none}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-card">
    <div class="login-avatar">ج</div>
    <h1>الجدولة</h1>
    <div class="login-divider"></div>
    <div class="login-sub">أدخل رمز الدخول لعرض جدول الدوام</div>
    <div class="login-error" id="loginError"></div>
    <input type="password" class="login-input" id="loginCodeInput" placeholder="رمز الدخول" maxlength="20">
    <button class="login-btn" id="loginSubmitBtn">دخول</button>
  </div>
</div>

<div id="appRoot">
<div class="topbar">
  <div class="topbar-brand">
    <div class="avatar-box">ج</div>
    <div>
      <h1>الجدولة</h1>
      <div class="sub" id="periodLabel">لا يوجد جدول بعد</div>
    </div>
  </div>
  <div class="topbar-actions">
    <button class="btn btn-ghost" id="weekViewBtn">عرض الأسبوع 🖼️</button>
    <button class="btn btn-ghost" id="refreshBtn">تحديث ⟳</button>
    <button class="btn btn-ghost" id="settingsBtn">الإعدادات 🔒</button>
    <button class="btn btn-primary" id="shiftEditBtn">تعديل الصفحة 🔒</button>
  </div>
</div>

<div class="wrap" id="app"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// ---------- Supabase setup ----------
const SUPABASE_URL = 'https://uxuxqmwpsokylsyndjcx.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InV4dXhxbXdwc29reWxzeW5kamN4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDgzMzUsImV4cCI6MjEwMjQ4NDMzNX0.KTXgsjAkbfEAxx1_Dr1E5Jjs0Y5N8enoVNcccasARvk';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function getValue(key){
  const { data, error } = await sb.from('app_data').select('value').eq('key', key).maybeSingle();
  if(error) throw error;
  return data ? data.value : null;
}
async function setValue(key, value){
  const { error } = await sb.from('app_data').upsert({ key, value }, { onConflict: 'key' });
  if(error) throw error;
  return true;
}

const STORAGE_KEYS = { settings: 'scheduler:settings', schedule: 'scheduler:schedule' };
const ACCESS_PASSWORD = '0123';
const SITE_ACCESS_CODE = 'SCH013';
const SITE_ACCESS_STORAGE_KEY = 'scheduler:site_access_granted';

// ---------- Login gate ----------
function initLoginGate(){
  const loginScreen = document.getElementById('loginScreen');
  const appRoot = document.getElementById('appRoot');
  const input = document.getElementById('loginCodeInput');
  const errEl = document.getElementById('loginError');
  const submitBtn = document.getElementById('loginSubmitBtn');

  function grantAccess(){
    try{ localStorage.setItem(SITE_ACCESS_STORAGE_KEY, '1'); }catch(e){}
    loginScreen.style.display = 'none';
    appRoot.style.display = 'block';
    loadAll();
  }

  let alreadyGranted = false;
  try{ alreadyGranted = localStorage.getItem(SITE_ACCESS_STORAGE_KEY) === '1'; }catch(e){}
  if(alreadyGranted){
    grantAccess();
    return;
  }

  function tryLogin(){
    const val = (input.value || '').trim();
    if(val === SITE_ACCESS_CODE){
      errEl.textContent = '';
      grantAccess();
    } else {
      errEl.textContent = 'رمز الدخول غير صحيح، حاول مرة أخرى';
      input.focus();
      input.select();
    }
  }
  submitBtn.addEventListener('click', tryLogin);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryLogin(); });
  input.focus();
}

const SHIFT_PRESETS = [
  {start:'00:00', end:'08:00', label:'00:00 - 08:00'},
  {start:'08:00', end:'17:00', label:'08:00 - 17:00'},
  {start:'10:00', end:'19:00', label:'10:00 - 19:00'},
  {start:'12:00', end:'21:00', label:'12:00 - 21:00'},
  {start:'14:00', end:'23:00', label:'14:00 - 23:00'},
  {start:'16:00', end:'01:00', label:'16:00 - 01:00'},
];

let state = {
  settingsMode: false,
  shiftEditMode: false,
  weekView: false,
  weekIndex: 0,
  settings: null,
  schedule: null,
  selectedEmployeeId: null,
  swapMode: false,
  saving: false,
  error: null,
  successMsg: null,
  dirty: false,
  adminTab: 'general',
};

function emptySettings(){
  return {
    employees: [],
    generalNotes: '',
    generalConditions: '',
    breakNotes: '',
    labelsNotes: '',
    startDate: '',
    endDate: '',
    shiftLabels: [
      {id: uid('sl'), name:'الوردية الصباحية', color:'#E8D9B5'},
      {id: uid('sl'), name:'الوردية المسائية', color:'#E3B98C'},
      {id: uid('sl'), name:'الوردية الليلية', color:'#B9AED9'},
    ],
    labels: [
      {id: uid('lb'), name:'ATM', color:'#E8896F'},
    ]
  };
}

async function loadAll(){
  try{
    const s = await getValue(STORAGE_KEYS.settings);
    state.settings = s ? s : emptySettings();
    if(!state.settings.shiftLabels) state.settings.shiftLabels = emptySettings().shiftLabels;
    if(!state.settings.labels) state.settings.labels = emptySettings().labels;
    if(state.settings.generalNotes === undefined) state.settings.generalNotes = '';
    if(state.settings.generalConditions === undefined) state.settings.generalConditions = '';
    if(state.settings.breakNotes === undefined) state.settings.breakNotes = '';
    if(state.settings.labelsNotes === undefined) state.settings.labelsNotes = '';
    (state.settings.employees||[]).forEach(e=>{ if(!e.color) e.color=''; });
  }catch(e){ state.settings = emptySettings(); state.error = 'تعذّر الاتصال بقاعدة البيانات: ' + e.message; }
  try{
    const sc = await getValue(STORAGE_KEYS.schedule);
    state.schedule = sc ? sc : null;
  }catch(e){ state.schedule = null; }
  render();
}

async function saveSettings(){
  try{
    await setValue(STORAGE_KEYS.settings, state.settings);
  }catch(e){
    throw new Error('لم يتم حفظ الإعدادات، حاول مرة أخرى (' + e.message + ')');
  }
}
async function saveSchedule(){
  try{
    await setValue(STORAGE_KEYS.schedule, state.schedule);
  }catch(e){
    throw new Error('لم يتم حفظ الجدول، حاول مرة أخرى (' + e.message + ')');
  }
}

function uid(prefix){ return prefix + '_' + Math.random().toString(36).slice(2,9); }
function markDirty(){ state.dirty = true; }

// ---------- Mode gates (settings / shift edit) ----------
document.getElementById('settingsBtn').addEventListener('click', ()=>{
  if(state.settingsMode){ state.settingsMode = false; render(); return; }
  showPasswordModal(()=>{
    state.settingsMode = true;
    state.shiftEditMode = false;
    state.weekView = false;
  });
});
document.getElementById('shiftEditBtn').addEventListener('click', ()=>{
  if(state.shiftEditMode){ state.shiftEditMode = false; render(); return; }
  showPasswordModal(()=>{
    state.shiftEditMode = true;
    state.settingsMode = false;
    state.weekView = false;
  });
});
document.getElementById('refreshBtn').addEventListener('click', ()=>{
  if(state.settingsMode && state.dirty){
    showConfirmModal('انت بوضع الإعدادات وعندك تغييرات غير محفوظة. الضغط على تحديث سيلغيها. هل تريد المتابعة؟', loadAll);
    return;
  }
  loadAll();
});
document.getElementById('weekViewBtn').addEventListener('click', ()=>{
  if(!state.schedule || !state.schedule.days || state.schedule.days.length===0){
    alert('لا يوجد جدول لعرضه بعد');
    return;
  }
  state.weekView = true;
  state.weekIndex = 0;
  render();
});

function showPasswordModal(onSuccess){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <div style="font-weight:900;font-size:16px;color:var(--teal)">كلمة المرور</div>
      <input type="password" id="pwInput" maxlength="4" placeholder="••••" />
      <div id="pwErr" style="color:var(--danger);font-size:12px;min-height:16px"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-outline" style="flex:1" id="pwCancel">إلغاء</button>
        <button class="btn btn-primary" style="flex:1" id="pwOk">دخول</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  const input = bg.querySelector('#pwInput');
  input.focus();
  const tryEnter = ()=>{
    if(input.value === ACCESS_PASSWORD){
      bg.remove();
      onSuccess();
      render();
    } else {
      bg.querySelector('#pwErr').textContent = 'كلمة المرور غير صحيحة';
    }
  };
  bg.querySelector('#pwOk').addEventListener('click', tryEnter);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') tryEnter(); });
  bg.querySelector('#pwCancel').addEventListener('click', ()=>bg.remove());
}

function showConfirmModal(message, onConfirm){
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal">
      <div style="font-weight:900;font-size:16px;color:var(--danger)">تأكيد</div>
      <div style="font-size:14px;color:var(--ink);margin:14px 0;line-height:1.6">${esc(message)}</div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="btn btn-outline" style="flex:1" id="confirmCancel">إلغاء</button>
        <button class="btn btn-danger" style="flex:1" id="confirmOk">تأكيد</button>
      </div>
    </div>`;
  document.body.appendChild(bg);
  bg.querySelector('#confirmCancel').addEventListener('click', ()=> bg.remove());
  bg.querySelector('#confirmOk').addEventListener('click', ()=>{
    bg.remove();
    onConfirm();
  });
}

// ---------- Rendering ----------
function render(){
  const app = document.getElementById('app');
  const label = document.getElementById('periodLabel');
  if(state.schedule && state.schedule.period){
    label.textContent = `الفترة: ${state.schedule.period.start} → ${state.schedule.period.end}`;
  } else {
    label.textContent = 'لا يوجد جدول بعد — استخدم الإعدادات لإنشاء واحد';
  }
  document.getElementById('settingsBtn').textContent = state.settingsMode ? 'الخروج من الإعدادات 🔓' : 'الإعدادات 🔒';
  document.getElementById('shiftEditBtn').textContent = state.shiftEditMode ? 'إنهاء التعديل 🔓' : 'تعديل 🔒';

  // remove any existing week overlay
  const oldOverlay = document.getElementById('weekOverlay');
  if(oldOverlay) oldOverlay.remove();

  app.innerHTML = '';
  if(state.weekView){
    document.body.appendChild(renderWeekView());
    return;
  }
  if(state.settingsMode){
    app.appendChild(renderAdmin());
  } else if(state.shiftEditMode){
    app.appendChild(renderShiftEditor());
  } else {
    app.appendChild(renderEmployeeView());
  }
}

function renderLabelListRows(container, list){
  container.innerHTML = '';
  list.forEach((item, idx)=>{
    const row = document.createElement('div');
    row.className = 'label-row';
    row.innerHTML = `
      <input type="text" placeholder="الاسم" value="${esc(item.name)}" data-f="name">
      <input type="color" value="${item.color||'#E8D9B5'}" data-f="color">
      <button class="btn btn-danger btn-sm" data-del>✕</button>
    `;
    row.querySelector('[data-f="name"]').addEventListener('input', e=>{ item.name = e.target.value; markDirty(); });
    row.querySelector('[data-f="color"]').addEventListener('input', e=>{ item.color = e.target.value; markDirty(); });
    row.querySelector('[data-del]').addEventListener('click', ()=>{
      list.splice(idx,1);
      renderLabelListRows(container, list);
      markDirty();
    });
    container.appendChild(row);
  });
}

function renderEmpRows(container){
  container.innerHTML = '';
  state.settings.employees.forEach((emp, idx)=>{
    const row = document.createElement('div');
    row.className = 'emp-row';
    row.innerHTML = `
      <input type="text" placeholder="ID" value="${esc(emp.id)}" data-f="id">
      <input type="text" placeholder="الاسم" value="${esc(emp.name)}" data-f="name">
      <select data-f="gender">
        <option value="ذكر" ${emp.gender==='ذكر'?'selected':''}>ذكر</option>
        <option value="انثى" ${emp.gender==='انثى'?'selected':''}>انثى</option>
      </select>
      <input type="text" placeholder="ملاحظة" value="${esc(emp.note)}" data-f="note">
      <input type="color" value="${emp.color||'#E8D9B5'}" data-f="color" title="لون خاص بالموظف">
      <button class="btn btn-danger btn-sm" data-del>✕</button>
    `;
    row.querySelectorAll('input,select').forEach(inp=>{
      inp.addEventListener('input', e=>{
        emp[e.target.dataset.f] = e.target.value;
        markDirty();
      });
    });
    row.querySelector('[data-del]').addEventListener('click', ()=>{
      state.settings.employees.splice(idx,1);
      renderEmpRows(container);
      markDirty();
    });
    container.appendChild(row);
  });
}

async function onClearSchedule(){
  showConfirmModal('هل أنت متأكد من مسح الجدول الحالي بالكامل؟ لا يمكن التراجع عن هذا الإجراء، وسيختفي الجدول لكل الموظفين فوراً.', async ()=>{
    state.error = null; state.successMsg = null;
    try{
      state.schedule = null;
      await saveSchedule();
      state.successMsg = 'تم مسح الجدول بالكامل';
    }catch(e){
      state.error = 'فشل مسح الجدول: ' + e.message;
    }
    render();
    if(state.successMsg){
      setTimeout(()=>{ state.successMsg = null; render(); }, 4000);
    }
  });
}

async function onSaveSettings(){
  state.saving = true; state.error = null; state.successMsg = null; render();
  try{
    await saveSettings();
    state.successMsg = 'تم حفظ الإعدادات بنجاح';
    state.dirty = false;
  }catch(e){
    state.error = 'فشل الحفظ: ' + e.message;
  }
  state.saving = false;
  render();
  if(state.successMsg){
    setTimeout(()=>{ state.successMsg = null; render(); }, 4000);
  }
}

// ---------- Three-part prompt / import system ----------
function buildShiftsPrompt(settings){
  const empList = settings.employees.map((e,i)=>`${i+1}. id: "${e.id}" | الاسم: "${e.name}" | الجنس: ${e.gender} | ملاحظة خاصة: ${e.note||'لا يوجد'}`).join('\n');
  const system = `أنت محرك جدولة (Scheduling Engine) متخصص بتوزيع موظفي كول سنتر على شيفتات تغطي 24 ساعة/7 أيام.
مهمتك فقط: توزيع الموظفين على الشيفتات. لا تتعامل مع البريكات ولا مع أي ليبلات إضافية إطلاقاً.
أعد الرد بصيغة JSON فقط، يبدأ بـ { وينتهي بـ }، بدون \`\`\`json وبدون أي نص خارج الـ JSON.

قواعد صارمة:
1. كل يوم بالفترة يجب أن يكون مغطى بالكامل من 00:00 إلى 24:00 بدون فجوة أو تداخل.
2. استخدم فقط id الموظفين المعطاة بالضبط.
3. وزّع الشيفتات بعدالة قدر الإمكان على كامل الفترة.
4. طبّق "ملاحظة خاصة" لكل موظف حرفياً.
5. طبّق "الشروط العامة" و"الملاحظات العامة" كقواعد ملزمة.
6. إذا تعارضت الشروط مع تغطية الـ24 ساعة، أعطِ الأولوية للتغطية الكاملة.
7. اجعل employeeId=null فقط للشيفتات التي يتعذر تغطيتها رياضياً.
8. "label" وصف قصير بالعربي (مثال: "الوردية الصباحية").

صيغة الإخراج بالضبط:
{
  "days": [
    {
      "date": "YYYY-MM-DD",
      "shifts": [
        {"start":"00:00","end":"08:00","label":"الوردية الليلية","employeeId":"ID_من_القائمة"},
        {"start":"08:00","end":"16:00","label":"الوردية الصباحية","employeeId":"ID_من_القائمة"},
        {"start":"16:00","end":"24:00","label":"الوردية المسائية","employeeId":null}
      ]
    }
  ]
}`;
  const user = `أنشئ توزيع شيفتات كامل لكل يوم من ${settings.startDate} إلى ${settings.endDate} شامل الطرفين.

عدد الموظفين: ${settings.employees.length}
قائمة الموظفين:
${empList}

الملاحظات العامة: ${settings.generalNotes || 'لا يوجد'}
الشروط العامة: ${settings.generalConditions || 'لا يوجد (افتراضياً: شيفتات 8 ساعات، موظف واحد لكل شيفت)'}

أعد فقط كائن JSON بالصيغة أعلاه.`;
  return system + '\n\n---\n\n' + user;
}

function scheduleShiftsSummaryForPrompt(schedule){
  if(!schedule) return null;
  return schedule.days.map(d=>({
    date: d.date,
    shifts: d.shifts.map(s=>({start:s.start,end:s.end,label:s.label,employeeId:s.employeeId}))
  }));
}

function parseJSONLoose(raw){
  const cleaned = raw.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  return JSON.parse(cleaned);
}

function mergeShiftsImport(parsed, settings, oldSchedule){
  // build a lookup of old shifts by date|start|end to carry over breaks & tags
  const oldMap = {};
  if(oldSchedule && oldSchedule.days){
    oldSchedule.days.forEach(d=>{
      (d.shifts||[]).forEach(s=>{
        oldMap[d.date+'|'+s.start+'|'+s.end] = s;
      });
    });
  }
  const days = (parsed.days||[]).map(d=>({
    date: d.date,
    shifts: (d.shifts||[]).map(s=>{
      const key = d.date+'|'+s.start+'|'+s.end;
      const prior = oldMap[key];
      return {
        shiftId: (prior && prior.employeeId===(s.employeeId||null)) ? prior.shiftId : uid('sh'),
        start: s.start, end: s.end, label: s.label||'',
        employeeId: s.employeeId || null,
        breaks: prior ? (prior.breaks||[]) : [],
        tags: prior ? (prior.tags||[]) : []
      };
    })
  }));
  return {
    generatedAt: new Date().toISOString(),
    period: { start: settings.startDate, end: settings.endDate },
    days
  };
}

function applyBreaksImport(parsed, schedule){
  const dayMap = {};
  schedule.days.forEach(d=> dayMap[d.date] = d);
  (parsed.days||[]).forEach(pd=>{
    const day = dayMap[pd.date];
    if(!day) return;
    (pd.shifts||[]).forEach(ps=>{
      const shift = day.shifts.find(s=> s.start===ps.start && s.end===ps.end);
      if(!shift) return;
      shift.breaks = (ps.breaks||[]).map(b=>({
        breakId: uid('brk'), label: b.label||'', start: b.start, end: b.end
      }));
    });
  });
}

function applyLabelsImport(parsed, schedule){
  const dayMap = {};
  schedule.days.forEach(d=> dayMap[d.date] = d);
  (parsed.days||[]).forEach(pd=>{
    const day = dayMap[pd.date];
    if(!day) return;
    (pd.shifts||[]).forEach(ps=>{
      const shift = day.shifts.find(s=> s.start===ps.start && s.end===ps.end);
      if(!shift) return;
      shift.tags = ps.labels || ps.tags || [];
    });
  });
}

// ---------- Time & break helpers ----------
function timeToMinutes(t){
  if(!t) return null;
  const [h,m] = t.split(':').map(Number);
  return h*60 + m;
}
function breakDurationMinutes(b){
  let s = timeToMinutes(b.start), e = timeToMinutes(b.end);
  if(s==null || e==null) return 0;
  if(e <= s) e += 1440;
  return e - s;
}
function validateBreakAgainstShift(shift, brk){
  const warnings = [];
  if(!brk.start || !brk.end) return warnings;
  let shiftStart = timeToMinutes(shift.start), shiftEnd = timeToMinutes(shift.end);
  if(shiftEnd <= shiftStart) shiftEnd += 1440;
  let bStart = timeToMinutes(brk.start), bEnd = timeToMinutes(brk.end);
  if(bStart < shiftStart) bStart += 1440;
  if(bEnd <= bStart) bEnd += 1440;
  if(bStart - shiftStart < 75){
    warnings.push('يبدأ ضمن أول ساعة وربع من الدوام');
  }
  if(shiftEnd - bEnd < 60){
    warnings.push('ينتهي ضمن آخر ساعة من الدوام');
  }
  return warnings;
}
function concurrencyWarning(day, currentShiftId, brk){
  if(!brk.start || !brk.end) return null;
  const t = timeToMinutes(brk.start);
  let working = 0, onBreak = 0, currentIsWorking = false;
  day.shifts.forEach(s=>{
    if(!s.employeeId) return;
    let ss = timeToMinutes(s.start), se = timeToMinutes(s.end);
    if(se <= ss) se += 1440;
    let tt = t; if(tt < ss) tt += 1440;
    if(!(tt >= ss && tt < se)) return;
    working++;
    if(s.shiftId === currentShiftId){ currentIsWorking = true; return; }
    (s.breaks||[]).forEach(b=>{
      if(!b.start || !b.end) return;
      let bs = timeToMinutes(b.start), be = timeToMinutes(b.end);
      if(be <= bs) be += 1440;
      let tt2 = t; if(tt2 < bs) tt2 += 1440;
      if(tt2 >= bs && tt2 < be) onBreak++;
    });
  });
  if(currentIsWorking) onBreak++;
  if(working > 0 && (onBreak/working) > 0.25){
    return `أكثر من 25% من العاملين وقت ${brk.start} سيكونون على بريك (${onBreak} من ${working})`;
  }
  return null;
}

// ---------- Employee & color helpers ----------
function empById(id){
  return (state.settings.employees||[]).find(e=>e.id===id);
}
const FALLBACK_COLORS = ['#E8D9B5','#E3B98C','#B9AED9','#D9C2A6','#A8C9C2'];
function colorForLabel(label){
  let h=0; for(const c of (label||'')) h = (h*31 + c.charCodeAt(0))>>>0;
  return FALLBACK_COLORS[h % FALLBACK_COLORS.length];
}
function shiftColor(shift){
  const emp = shift.employeeId ? empById(shift.employeeId) : null;
  if(emp && emp.color) return emp.color;
  const sl = (state.settings.shiftLabels||[]).find(l=>l.name===shift.label);
  if(sl && sl.color) return sl.color;
  return shift.employeeId ? colorForLabel(shift.label) : '';
}
function labelDef(name){
  return (state.settings.labels||[]).find(l=>l.name===name);
}
function tagBadges(shift){
  return (shift.tags||[]).map(t=>{
    const ld = labelDef(t);
    const color = ld ? ld.color : '#B9AED9';
    return `<span class="badge" style="background:${color};color:#211C12">${esc(t)}</span>`;
  }).join('');
}

async function updateShift(shiftId, newEmployeeId){
  try{
    const sc = await getValue(STORAGE_KEYS.schedule);
    if(sc) state.schedule = sc;
  }catch(e){}
  for(const day of state.schedule.days){
    for(const s of day.shifts){
      if(s.shiftId === shiftId){ s.employeeId = newEmployeeId; }
    }
  }
  await saveSchedule();
  render();
}

function showShiftDetailsModal(shift){
  const emp = shift.employeeId ? empById(shift.employeeId) : null;

  const totalBreakMin = breaks.reduce((sum,b)=> sum + breakDurationMinutes(b), 0);
  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-width:360px;text-align:right">
      <div style="font-weight:900;font-size:16px;color:var(--teal);text-align:center;margin-bottom:10px">تفاصيل الشيفت</div>
      <div style="font-size:14px;line-height:1.9">

        ${shift.label ? `<div><b>الوصف:</b> ${esc(shift.label)}</div>` : ''}
        <div><b>الموظف:</b> ${emp ? esc(emp.name) : (shift.employeeId ? esc(shift.employeeId) : 'شاغر')}</div>
        ${ (shift.tags && shift.tags.length) ? `<div><b>الليبلات:</b> ${tagBadges(shift)}</div>` : '' }

        ? '<div class="hint">لا توجد بريكات مسجّلة لهذا الشيفت</div>'
        : `<div>${breaks.map(b=>`
            <div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px">
              <span>${esc(b.label || 'بريك')}</span>

        <div class="tag-row">${tagBadges(s)}</div>
      `;
      card.querySelector('.pencil-btn').addEventListener('click', ()=> showShiftEditModal(dayIdx, s.shiftId));

      const quickEmpSelect = document.createElement('select');
      quickEmpSelect.className = 'inline-emp-select';
      quickEmpSelect.innerHTML = employeeSelectOptions(s.employeeId);
      quickEmpSelect.addEventListener('click', e=> e.stopPropagation());
      quickEmpSelect.addEventListener('change', async (e)=>{
        s.employeeId = e.target.value || null;
        try{ await saveSchedule(); render(); }catch(err){ alert('فشل الحفظ: ' + err.message); }
      });
      card.appendChild(quickEmpSelect);
      grid.appendChild(card);
    });
    dayEl.appendChild(grid);
    el.appendChild(dayEl);
  });

  return el;
}

function employeeSelectOptions(selectedId){
  return ['<option value="">— شاغر (بدون موظف) —</option>']
    .concat(state.settings.employees.map(e=>
      `<option value="${esc(e.id)}" ${selectedId===e.id?'selected':''}>${esc(e.name||e.id)}</option>`
    )).join('');
}
function shiftLabelSelectOptions(selectedLabel){
  const opts = ['<option value="">— بدون تسمية —</option>'];
  (state.settings.shiftLabels||[]).forEach(l=>{
    opts.push(`<option value="${esc(l.name)}" ${selectedLabel===l.name?'selected':''}>${esc(l.name)}</option>`);
  });
  return opts.join('');
}

function showShiftEditModal(dayIdx, shiftId){
  const day = state.schedule.days[dayIdx];
  const shift = day.shifts.find(s=>s.shiftId===shiftId);
  if(!shift) return;

  let localBreaks = (shift.breaks||[]).map(b=>({...b}));
  let localTags = [...(shift.tags||[])];

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-width:400px;text-align:right">
      <div style="font-weight:900;font-size:16px;color:var(--teal);text-align:center;margin-bottom:6px">تعديل الشيفت</div>
      <div class="row-2">
        <div><label>من الساعة</label><input type="time" id="editStart" value="${esc(shift.start)}"></div>
        <div><label>إلى الساعة</label><input type="time" id="editEnd" value="${esc(shift.end)}"></div>
      </div>
      <label>الوصف/التسمية</label>
      <select id="editLabel">${shiftLabelSelectOptions(shift.label)}</select>
      <input type="text" id="editLabelCustom" value="${esc(shift.label)}" placeholder="أو اكتب تسمية مخصصة" style="margin-top:6px">
      <label>الموظف المسؤول</label>
      <select id="editEmp">${employeeSelectOptions(shift.employeeId)}</select>

      <label style="margin-top:14px">🏷️ الليبلات (مثل ATM)</label>
      <div id="tagsList" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px"></div>

      <label style="margin-top:14px">☕ البريكات (الاستراحات)</label>
      <div id="breaksList"></div>
      <div style="display:flex;gap:6px;margin:8px 0;flex-wrap:wrap">
        <button class="btn btn-outline btn-sm" id="addBreak1">+ بريك 15 د</button>
        <button class="btn btn-outline btn-sm" id="addBreak2">+ بريك غداء 30 د</button>
        <button class="btn btn-outline btn-sm" id="addBreak3">+ بريك 15 د</button>
      </div>
      <div id="breakWarnings" style="font-size:12px"></div>

      <div style="display:flex;gap:8px;margin-top:14px">
        <button class="btn btn-outline" style="flex:1" id="editCancel">إلغاء</button>
        <button class="btn btn-primary" style="flex:1" id="editSave">حفظ</button>
      </div>
      <button class="btn btn-danger btn-sm" style="width:100%;margin-top:8px" id="editDelete">🗑️ حذف هذا الشيفت</button>
    </div>`;
  document.body.appendChild(bg);

  function renderTagsList(){
    const box = bg.querySelector('#tagsList');
    const allLabels = state.settings.labels || [];
    box.innerHTML = allLabels.map(l=>{
      const active = localTags.includes(l.name);
      return `<span class="chip-tag" data-name="${esc(l.name)}" style="cursor:pointer;padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;border:1px solid ${l.color};background:${active?l.color:'transparent'};color:${active?'#211C12':l.color}">${esc(l.name)}</span>`;
    }).join('') || '<div class="hint">لا توجد ليبلات معرّفة — أضفها من الإعدادات</div>';
    box.querySelectorAll('[data-name]').forEach(chip=>{
      chip.addEventListener('click', ()=>{
        const name = chip.dataset.name;
        if(localTags.includes(name)) localTags = localTags.filter(t=>t!==name);
        else localTags.push(name);
        renderTagsList();
      });
    });
  }
  renderTagsList();

  bg.querySelector('#editLabel').addEventListener('change', e=>{
    if(e.target.value) bg.querySelector('#editLabelCustom').value = e.target.value;
  });

  function currentDraftShift(){
    return {
      shiftId: shift.shiftId,
      start: bg.querySelector('#editStart').value || shift.start,
      end: bg.querySelector('#editEnd').value || shift.end
    };
  }

  function renderWarnings(){
    const warnEl = bg.querySelector('#breakWarnings');
    const draft = currentDraftShift();
    const msgs = [];
    localBreaks.forEach((b,i)=>{
      validateBreakAgainstShift(draft, b).forEach(w=> msgs.push(`بريك ${i+1} (${b.label||'بدون اسم'}): ${w}`));
      const cw = concurrencyWarning(day, shift.shiftId, b);
      if(cw) msgs.push(`بريك ${i+1} (${b.label||'بدون اسم'}): ${cw}`);
    });
    const totalMin = localBreaks.reduce((sum,b)=> sum + breakDurationMinutes(b), 0);
    let html = msgs.map(m=>`<div style="color:var(--danger)">⚠️ ${esc(m)}</div>`).join('');
    html += `<div style="color:var(--ink-soft);margin-top:4px">إجمالي وقت البريكات المضافة: ${totalMin} دقيقة (المفترض ساعة كاملة = 60 دقيقة)</div>`;
    warnEl.innerHTML = html;
  }

  function renderBreaksList(){
    const list = bg.querySelector('#breaksList');
    if(localBreaks.length===0){
      list.innerHTML = '<div class="hint">لا توجد بريكات مضافة — استخدم الأزرار بالأسفل لإضافتها</div>';
    } else {
      list.innerHTML = localBreaks.map((b,i)=>`
        <div style="display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:6px;align-items:center;margin-bottom:6px">
          <input type="text" value="${esc(b.label)}" data-bf="label" data-i="${i}" placeholder="اسم البريك">
          <input type="time" value="${esc(b.start)}" data-bf="start" data-i="${i}">
          <input type="time" value="${esc(b.end)}" data-bf="end" data-i="${i}">
          <button class="btn btn-danger btn-sm" data-bdel="${i}">✕</button>
        </div>
      `).join('');
      list.querySelectorAll('[data-bf]').forEach(inp=>{
        inp.addEventListener('input', e=>{
          const i = +e.target.dataset.i;
          localBreaks[i][e.target.dataset.bf] = e.target.value;
          renderWarnings();
        });
      });
      list.querySelectorAll('[data-bdel]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          localBreaks.splice(+btn.dataset.bdel, 1);
          renderBreaksList();
        });
      });
    }
    renderWarnings();
  }
  renderBreaksList();

  function addBreak(label){
    localBreaks.push({ breakId: uid('brk'), label, start:'', end:'' });
    renderBreaksList();
  }
  bg.querySelector('#addBreak1').addEventListener('click', ()=> addBreak('بريك 1'));
  bg.querySelector('#addBreak2').addEventListener('click', ()=> addBreak('الغداء'));
  bg.querySelector('#addBreak3').addEventListener('click', ()=> addBreak('بريك 2'));

  bg.querySelector('#editStart').addEventListener('input', renderWarnings);
  bg.querySelector('#editEnd').addEventListener('input', renderWarnings);

  bg.querySelector('#editCancel').addEventListener('click', ()=> bg.remove());

  bg.querySelector('#editSave').addEventListener('click', async ()=>{
    const start = bg.querySelector('#editStart').value;
    const end = bg.querySelector('#editEnd').value;
    if(!start || !end){ alert('حدد وقت البداية والنهاية'); return; }
    shift.start = start;
    shift.end = end;
    shift.label = bg.querySelector('#editLabelCustom').value || bg.querySelector('#editLabel').value;
    shift.employeeId = bg.querySelector('#editEmp').value || null;
    shift.tags = localTags;
    shift.breaks = localBreaks
      .filter(b=> b.start && b.end)
      .map(b=>({ breakId: b.breakId || uid('brk'), label: b.label||'', start: b.start, end: b.end }));
    try{
      await saveSchedule();
      bg.remove();
      render();
    }catch(e){
      alert('فشل الحفظ: ' + e.message);
    }
  });

  bg.querySelector('#editDelete').addEventListener('click', async ()=>{
    day.shifts = day.shifts.filter(s=>s.shiftId!==shiftId);
    try{
      await saveSchedule();
      bg.remove();
      render();
    }catch(e){
      alert('فشل الحذف: ' + e.message);
    }
  });
}

function showDayEditModal(dayIdx){
  const day = state.schedule.days[dayIdx];
  const dateFmt = new Date(day.date).toLocaleDateString('ar-EG', { weekday:'long', month:'short', day:'numeric' });

  const bg = document.createElement('div');
  bg.className = 'modal-bg';
  bg.innerHTML = `
    <div class="modal" style="max-width:400px;text-align:right">
      <div style="font-weight:900;font-size:16px;color:var(--teal);text-align:center">إدارة شيفتات اليوم</div>
      <div style="font-size:13px;color:var(--ink-soft);text-align:center;margin-bottom:10px">${dateFmt}</div>
      <div id="dayShiftsList" style="max-height:220px;overflow:auto;margin-bottom:6px"></div>
      <hr style="border:none;border-top:1px solid var(--line);margin:10px 0">
      <button class="btn btn-danger btn-sm" style="width:100%" id="deleteDayBtn">🗑️ حذف هذا اليوم كاملاً من الجدول</button>
      <button class="btn btn-outline" style="width:100%;margin-top:10px" id="dayEditClose">إغلاق</button>
    </div>`;
  document.body.appendChild(bg);

  function renderList(){
    const list = bg.querySelector('#dayShiftsList');
    if(day.shifts.length===0){
      list.innerHTML = '<div class="hint">لا توجد شيفتات لهذا اليوم — استخدم أزرار الإضافة السريعة</div>';
      return;
    }
    list.innerHTML = day.shifts.map(s=>{
      const emp = s.employeeId ? empById(s.employeeId) : null;
      return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px">
        <span>${esc(s.start)}-${esc(s.end)} · ${esc(emp?emp.name:(s.employeeId||'شاغر'))}${s.label?' · '+esc(s.label):''}</span>
        <button class="btn btn-danger btn-sm" data-del="${s.shiftId}">حذف</button>
      </div>`;
    }).join('');
    list.querySelectorAll('[data-del]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        day.shifts = day.shifts.filter(s=>s.shiftId!==btn.dataset.del);
        try{
          await saveSchedule();
          renderList();
          render();
        }catch(e){
          alert('فشل الحذف: ' + e.message);
        }
      });
    });
  }
  renderList();

  bg.querySelector('#deleteDayBtn').addEventListener('click', ()=>{
    showConfirmModal('هل تريد حذف هذا اليوم بالكامل من الجدول؟', async ()=>{
      state.schedule.days = state.schedule.days.filter((d,i)=> i!==dayIdx);
      try{ await saveSchedule(); }catch(e){}
      bg.remove();
      render();
    });
  });

  bg.querySelector('#dayEditClose').addEventListener('click', ()=>{ bg.remove(); render(); });
}

// ---------- Week view (Sat -> Fri, screenshot friendly) ----------
function satIndex(dateStr){
  const d = new Date(dateStr);
  return (d.getDay()+1)%7; // Sat=0 ... Fri=6
}
function getWeeksFromSchedule(schedule){
  const weeks = {};
  schedule.days.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(day=>{
    const d = new Date(day.date);
    const idx = satIndex(day.date);
    const satDate = new Date(d);
    satDate.setDate(d.getDate()-idx);
    const key = satDate.toISOString().slice(0,10);
    if(!weeks[key]) weeks[key] = [];
    weeks[key].push(day);
  });
  return Object.keys(weeks).sort().map(k=>({weekStart:k, days:weeks[k]}));
}

function renderWeekView(){
  const overlay = document.createElement('div');
  overlay.className = 'week-overlay';
  overlay.id = 'weekOverlay';

  const weeks = getWeeksFromSchedule(state.schedule);
  if(weeks.length===0){
    overlay.innerHTML = `<div class="card empty">لا يوجد بيانات لعرضها</div>
      <button class="btn btn-outline" id="closeWeekBtn">إغلاق</button>`;
    overlay.querySelector('#closeWeekBtn').addEventListener('click', ()=>{ state.weekView=false; render(); });
    return overlay;
  }
  if(state.weekIndex >= weeks.length) state.weekIndex = 0;
  const week = weeks[state.weekIndex];

  const dayNames = ['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
  const satDate = new Date(week.weekStart);
  const columns = [];
  for(let i=0;i<7;i++){
    const d = new Date(satDate);
    d.setDate(satDate.getDate()+i);
    const dateStr = d.toISOString().slice(0,10);
    const dayData = week.days.find(dd=>dd.date===dateStr);
    columns.push({dateStr, dayName: dayNames[i], dayData});
  }

  const header = document.createElement('div');
  header.style.cssText = 'display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px';
  header.innerHTML = `
    <div style="font-weight:900;color:var(--teal);font-size:16px">🗓️ عرض الأسبوع (سبت → جمعة) — جاهز للسكرين شوت</div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${weeks.length>1 ? `<select id="weekPicker">${weeks.map((w,i)=>`<option value="${i}" ${i===state.weekIndex?'selected':''}>الأسبوع ${i+1} (${w.weekStart})</option>`).join('')}</select>` : ''}
      <button class="btn btn-outline btn-sm" id="printWeekBtn">🖨️ طباعة</button>
      <button class="btn btn-primary btn-sm" id="closeWeekBtn">إغلاق</button>
    </div>`;
  overlay.appendChild(header);

  const grid = document.createElement('div');
  grid.className = 'week-grid';
  columns.forEach(col=>{
    const colEl = document.createElement('div');
    colEl.className = 'week-col';
    const dateFmt = new Date(col.dateStr).toLocaleDateString('ar-EG', { month:'short', day:'numeric' });
    colEl.innerHTML = `<h4>${col.dayName}<br><span style="font-weight:400;color:var(--ink-soft)">${dateFmt}</span></h4>`;
    if(!col.dayData || col.dayData.shifts.length===0){
      colEl.innerHTML += `<div class="hint" style="text-align:center">لا بيانات</div>`;
    } else {
      col.dayData.shifts.slice().sort((a,b)=> a.start.localeCompare(b.start)).forEach(s=>{
        const emp = s.employeeId ? empById(s.employeeId) : null;
        const box = document.createElement('div');
        box.className = 'week-shift';
        box.style.background = shiftColor(s) || '#F3F4F6';
        box.innerHTML = `
          <div style="font-weight:900">${s.start}-${s.end}</div>
          <div style="font-weight:700">${emp?esc(emp.name):(s.employeeId?esc(s.employeeId):'شاغر')}</div>
          ${s.label?`<div style="opacity:.75">${esc(s.label)}</div>`:''}
          <div class="tag-row">${tagBadges(s)}</div>
        `;
        colEl.appendChild(box);
      });
    }
    grid.appendChild(colEl);
  });
  overlay.appendChild(grid);

  if(weeks.length>1){
    header.querySelector('#weekPicker').addEventListener('change', e=>{
      state.weekIndex = +e.target.value;
      render();
    });
  }
  header.querySelector('#printWeekBtn').addEventListener('click', ()=> window.print());
  header.querySelector('#closeWeekBtn').addEventListener('click', ()=>{ state.weekView=false; render(); });

  return overlay;
}

function esc(str){
  return (str||'').toString().replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
